name: Repair replay provenance equivalence v2

on:
  push:
    branches:
      - mirror/pr41-replay-provenance-equivalence-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr41-replay-provenance-equivalence-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' build ruff
      - name: Apply provenance-equivalence repair and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('h3_flow_regenerate/same_state_high_replay.py')
          text = path.read_text()
          needle = '''def _provenance_digest(manifest: dict[str, Any]) -> str:\n    return _sha_json(_normalize_provenance(manifest))\n\n\n'''
          replacement = '''def _provenance_digest(manifest: dict[str, Any]) -> str:\n    return _sha_json(_normalize_provenance(manifest))\n\n\n_PROVENANCE_EQ_DROP_TOP_LEVEL = frozenset(\n    {\n        "capture_phase",\n        "cwd",\n        "patcher_is_injected",\n        "replay_checkpoint_identity_exact",\n    }\n)\n_DIAGNOSTIC_FLOW_SOURCE_FILES = frozenset(\n    {\n        "execution_contract_diagnostics.py",\n        "execution_contract_provenance.py",\n        "execution_contract_runtime_observation.py",\n        "same_state_high_replay.py",\n    }\n)\n\n\ndef _diagnostic_flow_source_entry(value: Any) -> bool:\n    if not isinstance(value, dict):\n        return False\n    file_info = value.get("file")\n    if not isinstance(file_info, dict):\n        return False\n    raw_path = file_info.get("resolved_path") or file_info.get("path")\n    if not isinstance(raw_path, str):\n        return False\n    return Path(raw_path).name.lower() in _DIAGNOSTIC_FLOW_SOURCE_FILES\n\n\ndef _provenance_equivalence_identity(manifest: dict[str, Any]) -> dict[str, Any]:\n    """Return the causal capture/replay provenance identity for experiment R.\n\n    The full normalized manifest remains stored and hash-checked for audit. R's\n    cross-process equality gate compares executed source bytes and effective\n    production policy, not repository bookkeeping or mutable lifecycle state.\n    Git HEAD/dirty metadata is redundant with each loaded file's SHA-256 and can\n    change after a history-only squash without changing executed code. Likewise,\n    patcher injection state is intentionally allowed to differ between the warm\n    capture process and cold replay process. R/O/C diagnostic implementation\n    files and wrappers are measurement plumbing rather than production runtime.\n    """\n    normalized = _normalize_provenance(manifest)\n    if not isinstance(normalized, dict):\n        raise TypeError("same-state replay provenance identity must be a dictionary")\n\n    def canonicalize(value: Any, path: tuple[str, ...] = ()) -> Any:\n        if isinstance(value, dict):\n            out = {}\n            for raw_key, item in value.items():\n                key = str(raw_key)\n                if not path and key in _PROVENANCE_EQ_DROP_TOP_LEVEL:\n                    continue\n                if key == "git":\n                    continue\n                out[key] = canonicalize(item, (*path, key))\n            return out\n        if isinstance(value, list):\n            items = value\n            if path == ("loaded_companion_sources", "flow"):\n                items = [item for item in value if not _diagnostic_flow_source_entry(item)]\n            return [canonicalize(item, (*path, "[]")) for item in items]\n        return value\n\n    return canonicalize(normalized)\n\n\ndef _bundle_provenance_equivalence_identity(manifest: dict[str, Any]) -> dict[str, Any]:\n    persisted = manifest.get("provenance_equivalence_identity")\n    persisted_digest = manifest.get("provenance_equivalence_digest")\n    if isinstance(persisted, dict):\n        if not isinstance(persisted_digest, str) or _sha_json(persisted) != persisted_digest:\n            raise RuntimeError("same-state replay provenance-equivalence digest is inconsistent")\n        return persisted\n    legacy = manifest.get("provenance_identity")\n    if not isinstance(legacy, dict):\n        raise RuntimeError("same-state replay bundle lacks installed-runtime provenance identity")\n    return _provenance_equivalence_identity(legacy)\n\n\ndef _provenance_diff_paths(left: Any, right: Any, *, limit: int = 24) -> list[str]:\n    differences: list[str] = []\n\n    def visit(a: Any, b: Any, path: str) -> None:\n        if len(differences) >= limit:\n            return\n        if isinstance(a, dict) and isinstance(b, dict):\n            for key in sorted(set(a) | set(b)):\n                child = f"{path}.{key}"\n                if key not in a:\n                    differences.append(child + " (capture missing)")\n                elif key not in b:\n                    differences.append(child + " (replay missing)")\n                else:\n                    visit(a[key], b[key], child)\n                if len(differences) >= limit:\n                    return\n            return\n        if isinstance(a, list) and isinstance(b, list):\n            if len(a) != len(b):\n                differences.append(f"{path}.length ({len(a)} != {len(b)})")\n                if len(differences) >= limit:\n                    return\n            for index, (a_item, b_item) in enumerate(zip(a, b)):\n                visit(a_item, b_item, f"{path}[{index}]")\n                if len(differences) >= limit:\n                    return\n            return\n        if _canonical_json(a) != _canonical_json(b):\n            differences.append(path)\n\n    visit(left, right, "$")\n    return differences\n\n\n'''
          if needle not in text:
              raise SystemExit('provenance insertion anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''    provenance_identity = _normalize_provenance(record.state.manifest)\n    manifest = {\n'''
          replacement = '''    provenance_identity = _normalize_provenance(record.state.manifest)\n    provenance_equivalence_identity = _provenance_equivalence_identity(record.state.manifest)\n    manifest = {\n'''
          if needle not in text:
              raise SystemExit('capture identity anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''        "provenance_digest": _sha_json(provenance_identity),\n        "provenance_identity": provenance_identity,\n'''
          replacement = '''        "provenance_digest": _sha_json(provenance_identity),\n        "provenance_identity": provenance_identity,\n        "provenance_equivalence_digest": _sha_json(provenance_equivalence_identity),\n        "provenance_equivalence_identity": provenance_equivalence_identity,\n'''
          if needle not in text:
              raise SystemExit('capture manifest anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''    current_provenance = _normalize_provenance(record.state.manifest)\n    if _sha_json(current_provenance) != str(state.manifest["provenance_digest"]):\n        raise RuntimeError("same-state replay installed runtime provenance differs from capture")\n'''
          replacement = '''    capture_provenance = _bundle_provenance_equivalence_identity(state.manifest)\n    current_provenance = _provenance_equivalence_identity(record.state.manifest)\n    provenance_differences = _provenance_diff_paths(capture_provenance, current_provenance)\n    if provenance_differences:\n        raise RuntimeError(\n            "same-state replay production runtime provenance differs from capture; differing fields: "\n            + ", ".join(provenance_differences)\n        )\n'''
          if needle not in text:
              raise SystemExit('replay gate anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''        provenance_exact = _sha_json(_normalize_provenance(record.state.manifest)) == state.manifest.get(\n            "provenance_digest"\n        )\n'''
          replacement = '''        replay_provenance = _provenance_equivalence_identity(record.state.manifest)\n        capture_provenance = _bundle_provenance_equivalence_identity(state.manifest)\n        provenance_differences = _provenance_diff_paths(capture_provenance, replay_provenance)\n        provenance_exact = not provenance_differences\n'''
          if needle not in text:
              raise SystemExit('report provenance anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''                "provenance_exact": provenance_exact,\n                "checkpoint_identity_exact": _dict_equal(\n'''
          replacement = '''                "provenance_exact": provenance_exact,\n                "provenance_differences": provenance_differences,\n                "checkpoint_identity_exact": _dict_equal(\n'''
          if needle not in text:
              raise SystemExit('report field anchor not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)

          tests = Path('tests/test_same_state_high_replay.py')
          t = tests.read_text()
          addition = '''


def test_replay_provenance_equivalence_uses_source_bytes_not_git_or_lifecycle_state():
    capture = {
        "capture_phase": "outer_sample_runtime",
        "cwd": "/capture",
        "patcher_is_injected": True,
        "imported_sources": {
            "comfy.samplers": {
                "resolved_path": "/ComfyUI/comfy/samplers.py",
                "sha256": "core-source",
                "git": {"available": True, "head": "capture-head", "dirty": True},
            }
        },
        "loaded_companion_sources": {
            "flow": [
                {
                    "module": "h3_flow_regenerate.same_state_high_replay",
                    "file": {
                        "resolved_path": "/custom_nodes/flow/h3_flow_regenerate/same_state_high_replay.py",
                        "sha256": "diagnostic-capture",
                        "git": {"available": True, "head": "capture-head", "dirty": True},
                    },
                },
                {
                    "module": "h3_flow_regenerate.runtime",
                    "file": {
                        "resolved_path": "/custom_nodes/flow/h3_flow_regenerate/runtime.py",
                        "sha256": "production-flow",
                        "git": {"available": True, "head": "capture-head", "dirty": True},
                    },
                },
            ]
        },
        "gate_complete": True,
        "unresolved": [],
    }
    cold = copy.deepcopy(capture)
    cold["capture_phase"] = "outer_sample_runtime"
    cold["cwd"] = "/replay"
    cold["patcher_is_injected"] = False
    cold["imported_sources"]["comfy.samplers"]["git"] = {
        "available": True,
        "head": "history-only-squash",
        "dirty": False,
    }
    cold["loaded_companion_sources"]["flow"][0]["file"]["sha256"] = "diagnostic-replay"
    cold["loaded_companion_sources"]["flow"][1]["file"]["git"]["head"] = "history-only-squash"

    assert replay._provenance_equivalence_identity(capture) == replay._provenance_equivalence_identity(cold)

    changed = copy.deepcopy(cold)
    changed["loaded_companion_sources"]["flow"][1]["file"]["sha256"] = "changed-production-flow"
    assert replay._provenance_equivalence_identity(capture) != replay._provenance_equivalence_identity(changed)


def test_replay_provenance_equivalence_legacy_bundle_and_diff_paths():
    capture = {
        "schema_version": 3,
        "gate_complete": True,
        "active_runtime_functions": {
            "runtime._run_progressive": {"code_digest": "capture"},
        },
    }
    manifest = {
        "provenance_identity": capture,
        "provenance_digest": replay._sha_json(capture),
    }
    legacy = replay._bundle_provenance_equivalence_identity(manifest)
    current = copy.deepcopy(capture)
    current["active_runtime_functions"]["runtime._run_progressive"]["code_digest"] = "replay"
    current = replay._provenance_equivalence_identity(current)

    differences = replay._provenance_diff_paths(legacy, current)
    assert differences == ["$.active_runtime_functions.runtime._run_progressive.code_digest"]
'''
          if 'test_replay_provenance_equivalence_uses_source_bytes_not_git_or_lifecycle_state' in t:
              raise SystemExit('tests already patched')
          tests.write_text(t + addition)
          PY
      - run: ruff format h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: ruff check h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: pytest -q tests/test_same_state_high_replay.py
      - run: python -m compileall -q h3_flow_regenerate
      - name: Commit validated mirror repair and remove temporary workflows
        run: |
          git config user.name xmarre
          git config user.email 54859656+xmarre@users.noreply.github.com
          git rm .github/workflows/pr41-provenance-equivalence-repair.yml
          git rm .github/workflows/pr41-provenance-equivalence-repair-v2.yml
          git add h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
          git commit -m 'Fix cold replay provenance equivalence gate'
          git push origin HEAD:mirror/pr41-replay-provenance-equivalence-20260915
