name: PR32 temporary formatter

on:
  push:
    branches:
      - mirror/pr32-00408-self-contained-audio-oracle-20260912

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr32-00408-self-contained-audio-oracle-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.11"
      - run: ruff format h3_flow_regenerate/pr32_audio_decode_oracle.py tests/test_pr32_audio_decode_oracle.py
      - run: git diff --check
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h3_flow_regenerate/pr32_audio_decode_oracle.py tests/test_pr32_audio_decode_oracle.py
          if git diff --cached --quiet; then
            echo "No formatter changes required"
          else
            git commit -m "Format PR32 audio oracle"
            git push origin HEAD:mirror/pr32-00408-self-contained-audio-oracle-20260912
          fi
