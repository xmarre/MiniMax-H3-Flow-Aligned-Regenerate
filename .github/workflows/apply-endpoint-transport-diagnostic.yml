name: Apply endpoint transport diagnostic

on:
  push:
    branches:
      - mirror/endpoint-state-transport-diagnostic-20260911

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[endpoint-diagnostic-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded diagnostic changes
        run: python .github/scripts/apply_endpoint_transport_diagnostic.py
      - name: Commit diagnostic candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Diagnostic endpoint-residual handoff comparator [endpoint-diagnostic-applied]"
          git push origin HEAD:mirror/endpoint-state-transport-diagnostic-20260911
