name: PR41 runtime gate hardening temporary

on:
  push:
    branches:
      - mirror/first-high-contract-implementation-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/first-high-contract-implementation-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harden runtime lifecycle gate and tests
        run: |
          echo '' | base64 -d | python
      - run: python -m pip install 'ruff==0.16.7'
      - run: ruff format h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py
      - run: ruff check h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py
      - name: Commit hardening and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py
          git rm .github/workflows/pr41-runtime-gate-hardening-temp.yml
          git commit -m 'Tighten runtime observation evidence gate'
          git push origin HEAD:mirror/first-high-contract-implementation-20260914
