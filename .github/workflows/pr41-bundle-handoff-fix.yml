name: PR41 bundle handoff fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pr41-bundle-handoff-fix.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/first-high-contract-implementation-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' build ruff
      - name: Patch bundle save and selector UX
        shell: python
        run: |
          from pathlib import Path
          p = Path('h3_flow_regenerate/same_state_high_replay.py')
          s = p.read_text()

          anchor = '''class H3SameStateReplayBundleSave:\n'''
          helpers = '''def _replay_bundle_output_dir() -> Path:\n    try:\n        import folder_paths  # type: ignore\n\n        return Path(folder_paths.get_output_directory()) / "h3_flow_replay"\n    except Exception:\n        return Path.cwd() / "output" / "h3_flow_replay"\n\n\ndef _saved_replay_manifests() -> list[str]:\n    output_dir = _replay_bundle_output_dir()\n    if not output_dir.is_dir():\n        return []\n    manifests = [path for path in output_dir.glob("*.json") if path.is_file()]\n    manifests.sort(key=lambda path: (path.stat().st_mtime_ns, path.name), reverse=True)\n    return [path.name for path in manifests]\n\n\ndef _resolve_replay_bundle_selector(selector: str) -> Path:\n    output_dir = _replay_bundle_output_dir().resolve()\n    value = str(selector).strip()\n    if value in {"", "[latest]"}:\n        manifests = _saved_replay_manifests()\n        if not manifests:\n            raise RuntimeError(\n                "no saved same-state replay bundle exists; run Save MiniMax H3 Same-State Replay Bundle first"\n            )\n        value = manifests[0]\n    candidate = Path(value)\n    if candidate.name != value or candidate.suffix.lower() != ".json":\n        raise RuntimeError("same-state replay bundle selector must name a saved JSON manifest")\n    resolved = (output_dir / candidate).resolve(strict=True)\n    if resolved.parent != output_dir or not resolved.is_file():\n        raise RuntimeError("selected same-state replay bundle is outside the replay output directory")\n    return resolved\n\n\n'''
          assert anchor in s
          s = s.replace(anchor, helpers + anchor, 1)

          old = '''class H3SameStateReplayBundleSave:\n    CATEGORY = "MiniMax H3/flow regenerate/diagnostic"\n    DESCRIPTION = (\n        "Save the latest experiment-R capture as a JSON manifest plus pure-tensor .pt payload. Connect the sampled "\n        "LATENT as trigger so the capture is complete before writing."\n    )\n    RETURN_TYPES = ("STRING",)\n    RETURN_NAMES = ("bundle_manifest",)\n    FUNCTION = "save"\n'''
          new = '''class H3SameStateReplayBundleSave:\n    CATEGORY = "MiniMax H3/flow regenerate/diagnostic"\n    DESCRIPTION = (\n        "Terminal output node for experiment R. It always executes when queued and saves the completed capture as a "\n        "JSON manifest plus pure-tensor .pt payload under output/h3_flow_replay. The cold-replay node discovers these "\n        "bundles automatically; no filesystem path copy/paste is required."\n    )\n    RETURN_TYPES = ("STRING",)\n    RETURN_NAMES = ("bundle_manifest",)\n    FUNCTION = "save"\n    OUTPUT_NODE = True\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        material = capture.complete.pop()\n        try:\n            import folder_paths  # type: ignore\n\n            output_dir = Path(folder_paths.get_output_directory()) / "h3_flow_replay"\n        except Exception:\n            output_dir = Path.cwd() / "output" / "h3_flow_replay"\n        manifest_path, _ = _save_material(material, output_dir, str(filename_prefix))\n        return (str(manifest_path),)\n'''
          new = '''        material = capture.complete.pop()\n        manifest_path, _ = _save_material(material, _replay_bundle_output_dir(), str(filename_prefix))\n        return {\n            "ui": {"text": [f"Saved replay bundle: {manifest_path.name}"]},\n            "result": (manifest_path.name,),\n        }\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    @classmethod\n    def INPUT_TYPES(cls):\n        return {\n            "required": {\n                "model": ("MODEL",),\n                "bundle_manifest": ("STRING", {"multiline": False}),\n            }\n        }\n\n    def apply(self, model, bundle_manifest):\n        return patch_same_state_replay(model, str(bundle_manifest))\n'''
          new = '''    @classmethod\n    def INPUT_TYPES(cls):\n        choices = ["[latest]", *_saved_replay_manifests()]\n        return {\n            "required": {\n                "model": ("MODEL",),\n                "bundle": (choices, {"default": "[latest]"}),\n            }\n        }\n\n    def apply(self, model, bundle):\n        manifest_path = _resolve_replay_bundle_selector(str(bundle))\n        return patch_same_state_replay(model, str(manifest_path))\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/test_same_state_high_replay.py')
          ts = t.read_text()
          ts += '''\n\ndef test_bundle_save_is_terminal_output_node():\n    assert replay.H3SameStateReplayBundleSave.OUTPUT_NODE is True\n\n\ndef test_replay_bundle_selector_defaults_to_latest_and_resolves_saved_manifest(tmp_path, monkeypatch):\n    monkeypatch.setattr(replay, "_replay_bundle_output_dir", lambda: tmp_path)\n    older = tmp_path / "older.json"\n    newer = tmp_path / "newer.json"\n    older.write_text("{}", encoding="utf-8")\n    newer.write_text("{}", encoding="utf-8")\n    import os\n\n    os.utime(older, ns=(1, 1))\n    os.utime(newer, ns=(2, 2))\n\n    choices = replay.H3SameStateHighReplay.INPUT_TYPES()["required"]["bundle"][0]\n    assert choices[0] == "[latest]"\n    assert choices[1:] == ["newer.json", "older.json"]\n    assert replay._resolve_replay_bundle_selector("[latest]") == newer.resolve()\n    assert replay._resolve_replay_bundle_selector("older.json") == older.resolve()\n\n\ndef test_replay_bundle_selector_rejects_paths_outside_replay_directory(tmp_path, monkeypatch):\n    monkeypatch.setattr(replay, "_replay_bundle_output_dir", lambda: tmp_path)\n    outside = tmp_path.parent / "outside.json"\n    outside.write_text("{}", encoding="utf-8")\n    try:\n        replay._resolve_replay_bundle_selector(str(outside))\n    except RuntimeError as exc:\n        assert "must name a saved JSON manifest" in str(exc)\n    else:  # pragma: no cover\n        raise AssertionError("absolute replay path was accepted")\n'''
          t.write_text(ts)

          d = Path('docs/FIRST_HIGH_STAGE_SAME_STATE_REPLAY.md')
          if d.exists():
              ds = d.read_text()
              ds = ds.replace('Connect the sampled LATENT to `Save MiniMax H3 Same-State Replay Bundle`.', 'Connect the sampled LATENT to `Save MiniMax H3 Same-State Replay Bundle`. The save node is a terminal `OUTPUT_NODE`, so its output does not need to be connected; queuing the graph executes it and writes the bundle under `output/h3_flow_replay`.')
              ds = ds.replace('pointing to the Job-1 bundle manifest', 'with `bundle=[latest]` (default), or select a specific saved manifest from its bundle dropdown')
              ds = ds.replace('bundle manifest path', 'saved bundle selector')
              d.write_text(ds)
      - run: ruff format h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: ruff check h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: pytest -q tests/test_same_state_high_replay.py
      - run: python -m compileall -q h3_flow_regenerate
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name xmarre
          git config user.email '54859656+xmarre@users.noreply.github.com'
          rm .github/workflows/pr41-bundle-handoff-fix.yml
          git add h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py docs/FIRST_HIGH_STAGE_SAME_STATE_REPLAY.md .github/workflows/pr41-bundle-handoff-fix.yml
          git commit -m 'Make replay bundle handoff native and persistent'
          git push origin HEAD:mirror/first-high-contract-implementation-20260914
