name: Integrate validated PR41 boundary repair into R

on:
  push:
    branches:
      - mirror/r-raw-boundary-integration-20260914
    paths:
      - .github/workflows/r-pr41-boundary-integrate-autopatch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/r-raw-boundary-integration-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Transplant validated PR41 repair delta
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git cherry-pick e17be81f024bda70a73799c00db58c8505570ccf
      - run: python -m pip install -e '.[test]' ruff
      - run: ruff check h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_runtime_observation.py h3_flow_regenerate/same_state_high_replay.py tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py tests/test_same_state_high_replay.py
      - run: ruff format --check h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_runtime_observation.py h3_flow_regenerate/same_state_high_replay.py tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py tests/test_same_state_high_replay.py
      - run: pytest -q tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py tests/test_same_state_high_replay.py
      - name: Remove one-shot workflow and preserve one integration commit
        run: |
          git rm .github/workflows/r-pr41-boundary-integrate-autopatch.yml
          git commit --amend --no-edit
          git push origin HEAD:mirror/r-raw-boundary-integration-20260914
