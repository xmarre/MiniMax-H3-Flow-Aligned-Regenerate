name: Flow E hostile self patch

on:
  push:
    branches:
      - mirror/first-high-sol-local-e-implementation-20260915
    paths:
      - .github/workflows/e-flow-hostile-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/e_flow_hostile_patch.py
      - name: Normalize pre-existing long diagnostic literals
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path("h3_flow_regenerate/first_high_sol_local_diagnostic.py")
          text = path.read_text()
          text = re.sub(
              r'    "first_high_h3_input_video": .*?\n',
              '    "first_high_h3_input_video": "b49f17a317530795be43bc775486777b07d5b5dbb28996819033cdede64195c0",\n',
              text,
              count=1,
          )
          replacements = {
              '        raise RuntimeError("first-high Sol-local E VDN diagnostic object-patch set is not exactly 50 H3 attention patches")':
                  '        raise RuntimeError(\n            "first-high Sol-local E VDN diagnostic object-patch set is not exactly "\n            "50 H3 attention patches"\n        )',
              '                raise RuntimeError(f"first-high Sol-local E provenance must contain exactly one {field_name} entry for {key}")':
                  '                raise RuntimeError(\n                    f"first-high Sol-local E provenance must contain exactly one "\n                    f"{field_name} entry for {key}"\n                )',
              '                f"first-high Sol-local E R companion source inventory is invalid for {group_name}: " + "; ".join(problems)':
                  '                f"first-high Sol-local E R companion source inventory is invalid for {group_name}: "\n                + "; ".join(problems)',
              '        raise RuntimeError(f"first-high Sol-local E requires preserved R capture {_EXPECTED_CAPTURE_ID}, got {capture_id}")':
                  '        raise RuntimeError(\n            f"first-high Sol-local E requires preserved R capture {_EXPECTED_CAPTURE_ID}, "\n            f"got {capture_id}"\n        )',
              '        raise RuntimeError(f"first-high Sol-local E requires 2 GiB CUDA headroom; only {int(free_cuda)} bytes free")':
                  '        raise RuntimeError(\n            f"first-high Sol-local E requires 2 GiB CUDA headroom; "\n            f"only {int(free_cuda)} bytes free"\n        )',
              '        raise RuntimeError(f"first-high Sol-local E requires 2 GiB host headroom; only {int(cpu_available)} bytes available")':
                  '        raise RuntimeError(\n            f"first-high Sol-local E requires 2 GiB host headroom; "\n            f"only {int(cpu_available)} bytes available"\n        )',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - run: python -m pip install ruff
      - run: ruff format h3_flow_regenerate/first_high_sol_local_diagnostic.py
      - name: Split decision-table literals that Ruff does not rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("h3_flow_regenerate/first_high_sol_local_diagnostic.py")
          text = path.read_text()
          text = text.replace(
              '"all-selected-arithmetic-mismatch: localize descriptor/stride/mask/normalization before any new H3 run"',
              '("all-selected-arithmetic-mismatch: localize descriptor/stride/" "mask/normalization before any new H3 run")',
          )
          text = text.replace(
              '"valid-e: decode E media; run only the design-table follow-up selected by that media plus witness result"',
              '("valid-e: decode E media; run only the design-table follow-up " "selected by that media plus witness result")',
          )
          path.write_text(text)
          PY
      - run: ruff format h3_flow_regenerate/first_high_sol_local_diagnostic.py
      - run: ruff check --fix h3_flow_regenerate/first_high_sol_local_diagnostic.py
      - name: Finalize exact source manifest hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def blob_sha(path):
              data = Path(path).read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          manifest_path = Path("h3_flow_regenerate/first_high_sol_local_e_source_delta.json")
          manifest = json.loads(manifest_path.read_text())
          mapping = {
              ("flow", "h3_flow_regenerate.first_high_sol_local_diagnostic", "."):
                  "h3_flow_regenerate/first_high_sol_local_diagnostic.py",
              ("flow", "h3_flow_regenerate.first_high_sol_local_diagnostic", "../__init__.py"):
                  "__init__.py",
          }
          for entry in manifest["entries"]:
              key = (entry.get("owner"), entry.get("module"), entry.get("relative_path", "."))
              path = mapping.get(key)
              if path:
                  entry["candidate_git_blob_sha"] = blob_sha(path)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - run: ruff check h3_flow_regenerate/first_high_sol_local_diagnostic.py
      - run: python -m compileall -q h3_flow_regenerate/first_high_sol_local_diagnostic.py
      - name: Commit patched source and remove one-shot patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h3_flow_regenerate/first_high_sol_local_diagnostic.py h3_flow_regenerate/first_high_sol_local_e_source_delta.json
          git rm .github/e_flow_hostile_patch.py .github/workflows/e-flow-hostile-self-patch.yml
          git commit -m "Harden first-high E validity gates"
          git push origin HEAD:mirror/first-high-sol-local-e-implementation-20260915
