name: Format PR41 temporary

on:
  push:
    branches:
      - mirror/first-high-contract-implementation-20260914

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/first-high-contract-implementation-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install 'ruff==0.16.7'
      - name: Format diagnostic files
        run: |
          ruff format h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_provenance.py tests/test_execution_contract_diagnostics.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_provenance.py tests/test_execution_contract_diagnostics.py
          git commit -m 'Apply ruff formatting'
          git push origin HEAD:mirror/first-high-contract-implementation-20260914
