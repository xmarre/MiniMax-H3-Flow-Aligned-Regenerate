name: tmp-pr30-ruff-fix

on:
  push:
    branches:
      - mirror/pr30-ruff-fix-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporary PR30 Ruff fix harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr30-ruff-fix-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate Ruff fixes
        run: |
          python -m pip install ruff >/dev/null
          ruff check --fix h3_flow_regenerate/runtime.py tests/test_mixed_grid.py
          ruff check .
          ruff format --check .
          python -m compileall -q h3_flow_regenerate tests
      - name: Commit source-only Ruff fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h3_flow_regenerate/runtime.py tests/test_mixed_grid.py
          git commit -m "Fix weighted activation lint ordering"
          git push origin HEAD:mirror/pr30-ruff-fix-20260911
