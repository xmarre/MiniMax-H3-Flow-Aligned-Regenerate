name: PR32 v5 Ruff helper

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr32-00391-authoritative-motion-20260912
          fetch-depth: 0
      - name: Apply Ruff fixes and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("h3_flow_regenerate/representation_bridge.py")
          text = path.read_text()
          text = text.replace(
              'def _authoritative_motion_prediction(exact_prefix: torch.Tensor) -> tuple[tuple[float, float, float, float] | None, dict]:',
              'def _authoritative_motion_prediction(\n    exact_prefix: torch.Tensor,\n) -> tuple[tuple[float, float, float, float] | None, dict]:',
          )
          text = text.replace(
              '    if any(value is None or not math.isfinite(float(value)) for value in (identity_error, aligned_error, prediction_error)):',
              '    holdout_errors = (identity_error, aligned_error, prediction_error)\n    if any(value is None or not math.isfinite(float(value)) for value in holdout_errors):',
          )
          text = text.replace(
              '    expected = _predict_transform(samples + [(holdout_index, _registration_transform(holdout) or identity)], prefix_t)',
              '    holdout_transform = _registration_transform(holdout) or identity\n    expected = _predict_transform([*samples, (holdout_index, holdout_transform)], prefix_t)',
          )
          path.write_text(text)
          PY
          git rm .github/workflows/pr32_v5_ruff_helper.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/representation_bridge.py
          git commit -m "Fix authoritative motion Ruff diagnostics"
          git push origin HEAD:mirror/pr32-00391-authoritative-motion-20260912
