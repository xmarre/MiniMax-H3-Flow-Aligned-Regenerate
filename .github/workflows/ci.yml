name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' build
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m compileall -q .
      - run: python -m build
      - name: Validate distribution license metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_path).decode("utf-8")
              assert "License-Expression: Apache-2.0" in metadata
              assert "License-File: LICENSE" in metadata
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)

          sdist = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist, "r:gz") as archive:
              assert any(member.name.endswith("/LICENSE") for member in archive.getmembers())
          PY
      - name: Validate built wheel in an isolated environment
        run: |
          WHEEL="$(pwd)/$(ls dist/*.whl | head -n 1)"
          python -m venv --system-site-packages /tmp/h3-flow-wheel
          /tmp/h3-flow-wheel/bin/python -m pip install --upgrade pip
          /tmp/h3-flow-wheel/bin/python -m pip install --no-deps "$WHEEL"
          (cd /tmp && /tmp/h3-flow-wheel/bin/python -c "import h3_flow_regenerate; assert h3_flow_regenerate.H3FlowTrajectory.api_version == 1")

  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned integration sources
        run: |
          git clone --filter=blob:none https://github.com/Comfy-Org/ComfyUI.git .contracts/ComfyUI
          git -C .contracts/ComfyUI checkout 1af040bf022569d7a890241c8dd79b296cda483f
          git clone --filter=blob:none https://github.com/Comfy-Org/ComfyUI.git .contracts/ComfyMask
          git -C .contracts/ComfyMask checkout 421a1c245c682c04d4325ba365f40c834c66f5b0
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3.git .contracts/Spectrum
          git -C .contracts/Spectrum checkout beb32dd210ef9e95520453107f158241d4f2ecf3
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3.git .contracts/SpectrumHistory
          git -C .contracts/SpectrumHistory checkout 5161f0457bc8c52535212d6783eee73f439e1537
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-H3-Continuum.git .contracts/Continuum
          git -C .contracts/Continuum checkout bf25353d8bec44afea22c89717c4301ce13c2036
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-DiffAid-Patches.git .contracts/DiffAid
          git -C .contracts/DiffAid checkout ba9d9efbcf7e64c755e068cb76547d8cc85481eb
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-MiniMax-H3-RefDelta-Solver.git .contracts/RefDelta
          git -C .contracts/RefDelta checkout 034e4c4c14c56bf76813cee4765e7164b0c7e0db
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-Untwisting-RoPE.git .contracts/Untwist
          git -C .contracts/Untwist checkout 299d4c56a3f057a97b3140d2136189bcd1e7d6bb
          git clone --filter=blob:none https://github.com/xmarre/Comfyui_Minimax_h3_latent_Upscaler-Plus.git .contracts/Upscaler
          git -C .contracts/Upscaler checkout 298c86c72765627f77c819221129dc642bd8b7cb
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-VDN-H3.git .contracts/VDN
          git -C .contracts/VDN checkout 1fc9d0d979683e3410587fac17358d3dd583e551
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-Sol-H3.git .contracts/SolPartitioned
          git -C .contracts/SolPartitioned checkout ef41676fb638d9e9e37f6c549277f10a7d47adf7
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI-VDN-H3-Plus.git .contracts/VDNPartitioned
          git -C .contracts/VDNPartitioned checkout f0ab77223742883bc4da2bc762b95d4fdee3e6e1
          git clone --filter=blob:none https://github.com/xmarre/ComfyUI.git .contracts/ComfyRuntime
          git -C .contracts/ComfyRuntime checkout c75777af734ff2881589fa7662723689462e8b39
      - name: Validate native and sibling contracts
        run: |
          python tools/check_source_contracts.py \
            --comfy .contracts/ComfyUI \
            --comfy-mask .contracts/ComfyMask \
            --spectrum .contracts/Spectrum \
            --continuum .contracts/Continuum \
            --diffaid .contracts/DiffAid \
            --refdelta .contracts/RefDelta \
            --untwist .contracts/Untwist \
            --upscaler .contracts/Upscaler
          python tools/check_target_sparse_contracts.py \
            --comfy .contracts/ComfyUI \
            --spectrum .contracts/Spectrum \
            --continuum .contracts/Continuum \
            --diffaid .contracts/DiffAid \
            --vdn .contracts/VDN
      - name: Execute mixed-grid and temporal VAE native source oracles
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.contracts/ComfyUI
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install pytest numpy scipy einops psutil safetensors tqdm pillow comfy-kitchen comfy-aimdo 'transformers>=4.50.3' sentencepiece torchsde
          python -m pytest tests/test_mixed_grid.py tests/test_decode_context.py tests/test_boundary_window_evidence.py tests/test_local_boundary_audit.py -q
      - name: Validate partitioned exact-prefix cross-repo contracts
        run: |
          python tools/check_partitioned_exact_prefix_contracts.py \
            --sol .contracts/SolPartitioned \
            --vdn .contracts/VDNPartitioned --require-boundary-witness
      - name: Validate partitioned completion receipts with Spectrum
        env:
          SPECTRUM_PATH: ${{ github.workspace }}/.contracts/SpectrumHistory
          PYTHONPATH: ${{ github.workspace }}/.contracts/SolPartitioned
        run: |
          python -m pytest -q \
            .contracts/SolPartitioned/tests/test_partitioned_forecast_history.py \
            .contracts/SolPartitioned/tests/test_partitioned_history.py \
            .contracts/SolPartitioned/tests/test_partitioned_domain_history.py \
            .contracts/SolPartitioned/tests/test_partitioned_unit_measure.py
      - name: Validate upstream Core adapter and MiniMax contracts
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.contracts/ComfyRuntime
          PYTHONPATH: ${{ github.workspace }}/.contracts/ComfyRuntime
        run: |
          python - <<'PY'
          import comfy.cli_args
          import pytest

          comfy.cli_args.args.cpu = True
          raise SystemExit(pytest.main([
              "-q",
              ".contracts/ComfyRuntime/tests-unit/comfy_test/test_minimax_h3_model.py",
              ".contracts/ComfyRuntime/tests-unit/comfy_quant/test_linear_input_act_hooks.py",
          ]))
          PY
          python -m pytest -q tests/test_video_overlap_sampling.py
      - name: Validate clean-transfer and residual coordinate ownership
        env:
          H3_UPSCALER_PATH: ${{ github.workspace }}/.contracts/Upscaler
          COMFYUI_PATH: ${{ github.workspace }}/.contracts/ComfyRuntime
          PYTHONPATH: ${{ github.workspace }}/.contracts/ComfyRuntime
        run: |
          python -m pytest -q --import-mode=importlib \
            tests/test_transfer_lattice.py \
            tests/test_transfer_lattice_source_contract.py \
            tests/test_flow_residual_lattice.py \
            tests/test_partitioned_seam_diagnostics.py \
            tests/test_residual_evidence_replay.py \
            .contracts/Upscaler/tests/test_h3_patch_lattice.py
      - name: Validate VDN post-forward workspace with Core bypass
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.contracts/ComfyRuntime
          PYTHONPATH: ${{ github.workspace }}/.contracts/VDNPartitioned:${{ github.workspace }}/.contracts/ComfyRuntime
        run: |
          python -m pytest -q \
            .contracts/VDNPartitioned/tests/test_post_forward_workspace.py \
            .contracts/VDNPartitioned/tests/test_bypass_reinject.py \
            .contracts/VDNPartitioned/tests/test_curve_apply.py \
            .contracts/VDNPartitioned/tests/test_runtime_lowvram.py
      - name: Validate partitioned K/V workspace and forward lifetime
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.contracts/ComfyRuntime
          PYTHONPATH: ${{ github.workspace }}/.contracts/VDNPartitioned:${{ github.workspace }}/.contracts/ComfyRuntime
        run: |
          python -m pytest -q \
            .contracts/VDNPartitioned/tests/test_partitioned_kv_workspace.py \
            .contracts/VDNPartitioned/tests/test_partitioned_forward_lifetime.py \
            .contracts/VDNPartitioned/tests/test_partitioned_grouped.py \
            .contracts/VDNPartitioned/tests/test_partition_index_cache.py \
            tests/test_partitioned_native_modulation.py
      - name: Validate native dense dispatch and deferred factorization errors
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.contracts/ComfyRuntime
          PYTHONPATH: ${{ github.workspace }}/.contracts/SolPartitioned:${{ github.workspace }}/.contracts/VDNPartitioned:${{ github.workspace }}/.contracts/ComfyRuntime
        run: |
          python -m pytest -q \
            .contracts/SolPartitioned/tests/test_partitioned_dense_dispatch.py \
            .contracts/SolPartitioned/tests/test_partitioned_weighted_dense.py \
            .contracts/SolPartitioned/tests/test_native_reference_cost.py \
            .contracts/SolPartitioned/tests/test_partitioned_unit_measure.py \
            .contracts/VDNPartitioned/tests/test_deferred_cholesky.py \
            .contracts/VDNPartitioned/tests/test_runtime_buffers.py \
            .contracts/VDNPartitioned/tests/test_partitioned_native_carrier.py \
            .contracts/VDNPartitioned/tests/test_partitioned_domain_stream.py \
            tests/test_partitioned_native_modulation.py::test_same_grid_probe_and_high_match_through_real_core_blocks_and_sol \
            tests/test_partitioned_target_band_native.py \
            tests/test_partitioned_target_band_domain.py \
            tests/test_partitioned_target_band_e2e.py \
            tests/test_partitioned_native_attention.py \
            .contracts/VDNPartitioned/tests/test_partitioned_attention_provider.py

