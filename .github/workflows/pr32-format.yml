name: PR32 Formatter

on:
  push:
    branches:
      - mirror/pr32-00410-bidirectional-audio-visual-boundary-20260912
    paths:
      - h3_flow_regenerate/pr32_audio_phase_align.py
      - h3_flow_regenerate/target_sparse.py
      - tests/test_pr32_audio_phase_align.py
      - tests/test_target_sparse.py
      - .github/workflows/pr32-format.yml

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr32-00410-bidirectional-audio-visual-boundary-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - name: Apply Ruff formatter
        run: |
          ruff format \
            h3_flow_regenerate/pr32_audio_phase_align.py \
            h3_flow_regenerate/target_sparse.py \
            tests/test_pr32_audio_phase_align.py \
            tests/test_target_sparse.py
      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add h3_flow_regenerate/pr32_audio_phase_align.py h3_flow_regenerate/target_sparse.py tests/test_pr32_audio_phase_align.py tests/test_target_sparse.py
          git commit -m '[ruff-formatted] Apply PR32 formatting'
          git push origin HEAD:mirror/pr32-00410-bidirectional-audio-visual-boundary-20260912
