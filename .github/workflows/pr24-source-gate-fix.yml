name: PR24 source gate fix

on:
  push:
    branches:
      - mirror/pr24-source-gate-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-source-gate-fix
      - name: Apply evidence-gate correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('h3_flow_regenerate/source_trajectory_bridge.py')
          s = p.read_text()
          old = '''_COMBINED_EVIDENCE_THRESHOLD = 2.5\n# The previous two-domain gate used a quadrature threshold of 2.5. Before the\n# learned upscaler there is intentionally no independent target-domain sample,\n# so require the equal-contribution per-domain equivalent instead of inventing\n# a new tuned threshold. Safe temporal-state evidence and post-warp reduction\n# remain mandatory as separate gates.\n_MIN_SOURCE_EVIDENCE = _COMBINED_EVIDENCE_THRESHOLD / math.sqrt(2.0)\n'''
          new = '''# Source authorization is deliberately multi-gate rather than a transplanted\n# scalar threshold. _motion_residual_candidate already requires the measured\n# residual to clear its estimator floor, improve the registration objective,\n# and stay inside the geometric safety bound. _temporal_profile then requires\n# directly observed safe temporal support, and apply_source_trajectory_bridge\n# finally verifies that the applied warp strictly reduces the measured residual.\n# axis_evidence_score is retained as a diagnostic only.\n'''
          if old not in s:
              raise SystemExit('constant block not found')
          s = s.replace(old, new, 1)

          old = '''        provisional = bool(candidate["axis_applied"][axis])\n        evidence = float(scores[axis])\n        selected = provisional and evidence >= _MIN_SOURCE_EVIDENCE\n        if not selected:\n            axis_reports.append(\n                {\n                    "selected": False,\n                    "accepted": False,\n                    "mode": "inactive",\n                    "reason": "source_evidence_below_authorization" if provisional else "axis_not_provisional",\n                    "source_evidence_score": evidence,\n                    "minimum_source_evidence": _MIN_SOURCE_EVIDENCE,\n                }\n            )\n'''
          new = '''        provisional = bool(candidate["axis_applied"][axis])\n        evidence = float(scores[axis])\n        # Do not gate a source-only measurement with the old two-domain\n        # quadrature threshold. Reaching this point already means the axis\n        # cleared the estimator floor, objective-gain floor, and safety bound.\n        # The measured temporal state below is the independent authorization\n        # evidence for whether that provisional residual is safe to correct.\n        selected = provisional\n        if not selected:\n            axis_reports.append(\n                {\n                    "selected": False,\n                    "accepted": False,\n                    "mode": "inactive",\n                    "reason": "axis_not_provisional",\n                    "source_evidence_score": evidence,\n                    "source_evidence_gate": "diagnostic_only",\n                }\n            )\n'''
          if old not in s:
              raise SystemExit('selection block not found')
          s = s.replace(old, new, 1)

          old = '''        axis_report.update(\n            selected=True,\n            source_evidence_score=evidence,\n            minimum_source_evidence=_MIN_SOURCE_EVIDENCE,\n        )\n'''
          new = '''        axis_report.update(\n            selected=True,\n            source_evidence_score=evidence,\n            source_evidence_gate="diagnostic_only",\n        )\n'''
          if old not in s:
              raise SystemExit('axis report block not found')
          s = s.replace(old, new, 1)

          old = '''        "source_trajectory_bridge_out_of_bounds_fraction": 0.0,\n        "source_trajectory_bridge_minimum_evidence": _MIN_SOURCE_EVIDENCE,\n    }\n'''
          new = '''        "source_trajectory_bridge_out_of_bounds_fraction": 0.0,\n        "source_trajectory_bridge_minimum_evidence": None,\n        "source_trajectory_bridge_evidence_policy": (\n            "estimator_floor+objective_gain+safety+observed_temporal_state+post_warp_reduction"\n        ),\n    }\n'''
          if old not in s:
              raise SystemExit('metrics block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/test_source_trajectory_bridge.py')
          s = p.read_text()
          s = s.replace('import math\n\n', '', 1)
          s = s.replace('from h3_flow_regenerate.source_trajectory_bridge import (\n    _MIN_SOURCE_EVIDENCE,\n    apply_source_trajectory_bridge,\n)\n', 'from h3_flow_regenerate.source_trajectory_bridge import (\n    _temporal_axis_state,\n    apply_source_trajectory_bridge,\n)\n', 1)
          s = s.replace('    assert report["source_trajectory_motion_residual"]["axis_evidence_score"][1] > _MIN_SOURCE_EVIDENCE\n', '    assert report["source_trajectory_temporal_profile"]["axis"][1]["source_evidence_gate"] == "diagnostic_only"\n', 1)
          old = '''def test_source_evidence_threshold_is_derived_from_existing_combined_gate():\n    assert pytest.approx(2.5 / math.sqrt(2.0)) == _MIN_SOURCE_EVIDENCE\n\n\n'''
          new = '''def test_estimator_floor_residual_can_be_temporally_authorized_without_cross_domain_gate():\n    report = _temporal_axis_state(\n        0.25,\n        [0.0, 0.0, -0.125, 0.125],\n        estimator_floor=0.25,\n        suffix_length=8,\n    )\n    assert report["accepted"] is True\n    assert report["mode"] == "persistent"\n    assert report["active_tokens"] == 5\n    assert report["applied_envelope"]["extrapolated_beyond_observation"] is False\n\n\ndef test_diverging_source_state_is_rejected_even_after_provisional_measurement():\n    report = _temporal_axis_state(\n        0.010161524669189069,\n        [0.007677082358897666, 0.012664654887307421, 0.020149107614304457, 0.01762725812058288],\n        estimator_floor=0.005,\n        suffix_length=8,\n    )\n    assert report["accepted"] is False\n    assert report["reason"] == "temporal_state_diverged"\n\n\n'''
          if old not in s:
              raise SystemExit('threshold test not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          for doc in [Path('docs/mixed-grid-seam-repair.md'), Path('docs/MIXED_GRID_CONTINUUM.md')]:
              s = doc.read_text()
              s = s.replace('2.5 / sqrt(2) ~= 1.76777', 'no transplanted two-domain scalar threshold')
              s = s.replace('2.5 / sqrt(2.0)', 'no transplanted two-domain scalar threshold')
              s = s.replace('2.5 / sqrt(2)', 'no transplanted two-domain scalar threshold')
              doc.write_text(s)
          PY
          rm .github/workflows/pr24-source-gate-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix source-only trajectory authorization"
          git push origin HEAD:mirror/pr24-source-gate-fix
