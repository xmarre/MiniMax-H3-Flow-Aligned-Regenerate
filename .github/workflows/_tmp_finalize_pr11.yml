name: tmp-finalize-pr11

on:
  push:
    branches:
      - mirror/pr11-final-media-20260904

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr11-final-media-20260904
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reconciliation
        run: |
          python .tmp_patch_pr11_v2.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/RESEARCH.md docs/BENCHMARKS.md docs/ARCHITECTURE.md
          git commit -m 'docs: reconcile learned handoff media evidence'
          git push origin HEAD:mirror/pr11-final-media-20260904
