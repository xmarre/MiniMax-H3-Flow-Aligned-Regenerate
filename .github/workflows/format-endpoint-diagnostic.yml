name: Format endpoint diagnostic

on:
  push:
    branches:
      - mirror/endpoint-state-transport-diagnostic-20260911

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[endpoint-format-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - name: Format bounded diagnostic files
        run: ruff format h3_flow_regenerate/handoff.py
      - name: Restore workflow file
        run: git checkout HEAD -- .github/workflows/format-endpoint-diagnostic.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/handoff.py
          git commit -m "Format endpoint diagnostic [endpoint-format-applied]"
          git push origin HEAD:mirror/endpoint-state-transport-diagnostic-20260911
