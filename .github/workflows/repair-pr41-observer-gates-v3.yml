name: Repair PR41 observer gates v3

on:
  push:
    branches:
      - mirror/pr41-observer-gate-repair-20260914
    paths:
      - .github/workflows/repair-pr41-observer-gates-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr41-observer-gate-repair-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded observer repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, found {n}")
              return text.replace(old, new, 1)

          p = Path("h3_flow_regenerate/execution_contract_diagnostics.py")
          s = p.read_text()
          helper = '''def _audio_roundtrip_check(low_audio: torch.Tensor, high_audio: torch.Tensor) -> dict[str, Any]:
              """Measure the float round trip between carried and reconstructed sampler audio."""
              bitwise = bool(torch.equal(low_audio, high_audio))
              result: dict[str, Any] = {
                  "carried_audio_exact": bitwise,
                  "carried_audio_bitwise_exact": bitwise,
              }
              if tuple(low_audio.shape) != tuple(high_audio.shape):
                  result.update(
                      carried_audio_roundtrip_within_dtype_tolerance=False,
                      carried_audio_roundtrip_reason="shape_mismatch",
                  )
                  return result
              if not low_audio.is_floating_point() or not high_audio.is_floating_point():
                  result.update(
                      carried_audio_roundtrip_within_dtype_tolerance=bitwise,
                      carried_audio_roundtrip_reason="non_floating_exact_only",
                  )
                  return result
              low = low_audio.detach().float()
              high = high_audio.detach().float()
              delta = high - low
              max_abs = float(delta.abs().max().item()) if delta.numel() else 0.0
              rms = float(delta.square().mean().sqrt().item()) if delta.numel() else 0.0
              scale = 1.0
              if low.numel():
                  scale = max(scale, float(low.abs().max().item()), float(high.abs().max().item()))
              eps = max(float(torch.finfo(low_audio.dtype).eps), float(torch.finfo(high_audio.dtype).eps))
              atol = 32.0 * eps * scale
              within = bool(torch.allclose(low_audio, high_audio, rtol=0.0, atol=atol))
              result.update(
                  carried_audio_roundtrip_within_dtype_tolerance=within,
                  carried_audio_roundtrip_max_abs=max_abs,
                  carried_audio_roundtrip_rms=rms,
                  carried_audio_roundtrip_atol=atol,
                  carried_audio_roundtrip_scale=scale,
                  carried_audio_roundtrip_eps=eps,
                  carried_audio_roundtrip_reason="inverse_noise_argument_then_noise_scaling",
              )
              return result


          '''
          s = one(
              s,
              "def _counter_delta(before: dict[str, int], after: dict[str, int]) -> dict[str, int]:\n",
              helper + "def _counter_delta(before: dict[str, int], after: dict[str, int]) -> dict[str, int]:\n",
              "audio helper",
          )
          s = one(
              s,
              '        exact_checks["carried_audio_exact"] = bool(torch.equal(low_audio, high_audio))\n',
              '        exact_checks.update(_audio_roundtrip_check(low_audio, high_audio))\n',
              "audio finalize",
          )
          s = one(
              s,
              '        and exact_checks.get("carried_audio_exact") is True\n',
              '        and exact_checks.get("carried_audio_roundtrip_within_dtype_tolerance") is True\n',
              "audio structural gate",
          )
          s = one(
              s,
              '        and companion_receipts_zero is True\n',
              '        and companion_receipts_zero is not False\n',
              "defer research receipt proof",
          )
          s = one(s, "    capture_mib: int = 256,\n", "    capture_mib: int = 512,\n", "patch capture default")
          s = one(
              s,
              '"capture_mib": ("INT", {"default": 256,',
              '"capture_mib": ("INT", {"default": 512,',
              "node capture default",
          )
          p.write_text(s)

          p = Path("h3_flow_regenerate/execution_contract_runtime_observation.py")
          s = p.read_text()
          s = one(
              s,
              '            "external_mixed_measure_removed_rows",\n            "vdn_local_sol_calls",',
              '            "external_mixed_measure_removed_rows",\n            "external_mixed_weighted_measure_calls",\n            "external_mixed_weighted_measure_q_rows",\n            "external_mixed_weighted_measure_kv_rows",\n            "vdn_local_sol_calls",',
              "weighted Sol snapshot fields",
          )
          block = '''research_fields = (
              "external_mixed_sol_calls",
              "external_mixed_q_rows",
              "external_mixed_kernel_q_rows",
              "external_mixed_measure_calls",
              "external_mixed_measure_q_rows",
              "external_mixed_measure_kv_rows_before",
              "external_mixed_measure_kv_rows_after",
              "external_mixed_measure_removed_rows",
              "external_mixed_weighted_measure_calls",
              "external_mixed_weighted_measure_q_rows",
              "external_mixed_weighted_measure_kv_rows",
          )
          research_receipts: dict[str, Any] = {}
          missing_research_receipts: list[str] = []
          nonzero_research_receipts: dict[str, Any] = {}
          for slot in _REQUIRED_COMPANION_SLOTS:
              call = companion_calls.get(slot) or {}
              for phase in ("before", "after"):
                  sol = (call.get(phase) or {}).get("sol")
                  if not isinstance(sol, dict):
                      missing_research_receipts.append(f"{slot}.{phase}.sol")
                      continue
                  for field in research_fields:
                      key = f"{slot}.{phase}.{field}"
                      if field not in sol:
                          missing_research_receipts.append(key)
                          continue
                      value = sol[field]
                      research_receipts[key] = value
                      if not isinstance(value, (bool, int, float)) or float(value) != 0.0:
                          nonzero_research_receipts[key] = value
          sol_research_receipts_complete = not missing_research_receipts
          sol_research_zero = sol_research_receipts_complete and not nonzero_research_receipts

          '''
          insert = textwrap.indent(textwrap.dedent(block), "    ")
          s = one(
              s,
              "    runtime_contract_complete = all(\n",
              insert + "    runtime_contract_complete = all(\n",
              "research receipt gate insertion",
          )
          s = one(
              s,
              "            observation_error_free,\n        )\n    )\n    return {",
              "            observation_error_free,\n            sol_research_receipts_complete,\n            sol_research_zero,\n        )\n    )\n    return {",
              "research receipt requirements",
          )
          s = one(
              s,
              '        "observation_errors": observation_errors,\n        "runtime_contract_complete": runtime_contract_complete,',
              '        "observation_errors": observation_errors,\n        "sol_research_receipts_complete": sol_research_receipts_complete,\n        "sol_research_zero": sol_research_zero,\n        "sol_research_receipts": research_receipts,\n        "missing_sol_research_receipts": missing_research_receipts,\n        "nonzero_sol_research_receipts": nonzero_research_receipts,\n        "runtime_contract_complete": runtime_contract_complete,',
              "research receipt report",
          )
          p.write_text(s)

          p = Path("tests/test_execution_contract_diagnostics.py")
          s = p.read_text()
          s += '''

          def test_audio_roundtrip_gate_accepts_float_rounding_but_rejects_material_change():
              low = torch.tensor([1.0, -2.0, 0.25], dtype=torch.float32)
              high = low.clone()
              high[0] = torch.nextafter(high[0], torch.tensor(float("inf"), dtype=high.dtype))
              rounded = diag._audio_roundtrip_check(low, high)
              assert rounded["carried_audio_exact"] is False
              assert rounded["carried_audio_bitwise_exact"] is False
              assert rounded["carried_audio_roundtrip_within_dtype_tolerance"] is True
              assert rounded["carried_audio_roundtrip_max_abs"] > 0.0
              changed = low.clone()
              changed[0] += 1e-3
              assert diag._audio_roundtrip_check(low, changed)["carried_audio_roundtrip_within_dtype_tolerance"] is False


          def test_execution_contract_default_capture_budget_is_512_mib():
              required = diag.H3ExecutionContractDiagnostics.INPUT_TYPES()["required"]
              assert required["capture_mib"][1]["default"] == 512
          '''
          p.write_text(s)

          p = Path("tests/test_execution_contract_runtime_observation.py")
          s = p.read_text()
          s = one(
              s,
              "        dense_calls=1,\n        backend_transitions=0,",
              "        dense_calls=1,\n        external_mixed_sol_calls=0,\n        external_mixed_q_rows=0,\n        external_mixed_kernel_q_rows=0,\n        external_mixed_measure_calls=0,\n        external_mixed_measure_q_rows=0,\n        external_mixed_measure_kv_rows_before=0,\n        external_mixed_measure_kv_rows_after=0,\n        external_mixed_measure_removed_rows=0,\n        external_mixed_weighted_measure_calls=0,\n        external_mixed_weighted_measure_q_rows=0,\n        external_mixed_weighted_measure_kv_rows=0,\n        backend_transitions=0,",
              "Sol snapshot fixture",
          )
          s = one(
              s,
              '    assert snapshot["evaluations"] == 2\n    assert snapshot["dense_attention_backends"] == ["sage"]',
              '    assert snapshot["evaluations"] == 2\n    assert snapshot["external_mixed_weighted_measure_calls"] == 0\n    assert snapshot["dense_attention_backends"] == ["sage"]',
              "weighted Sol assertion",
          )
          zero_sol = '''def _zero_research_sol_snapshot():
              return {
                  "request_active": True,
                  "forward_active": True,
                  "external_mixed_sol_calls": 0,
                  "external_mixed_q_rows": 0,
                  "external_mixed_kernel_q_rows": 0,
                  "external_mixed_measure_calls": 0,
                  "external_mixed_measure_q_rows": 0,
                  "external_mixed_measure_kv_rows_before": 0,
                  "external_mixed_measure_kv_rows_after": 0,
                  "external_mixed_measure_removed_rows": 0,
                  "external_mixed_weighted_measure_calls": 0,
                  "external_mixed_weighted_measure_q_rows": 0,
                  "external_mixed_weighted_measure_kv_rows": 0,
              }


          '''
          s = one(
              s,
              "def _complete_runtime_observation():\n",
              zero_sol + "def _complete_runtime_observation():\n",
              "research fixture helper",
          )
          old = '"sol": {"request_active": True, "forward_active": True},'
          if s.count(old) != 2:
              raise SystemExit(f"complete runtime Sol fixture: expected 2 matches, found {s.count(old)}")
          s = s.replace(old, '"sol": _zero_research_sol_snapshot(),')
          s += '''

          def test_runtime_gate_rejects_nonzero_weighted_mixed_receipt():
              runtime_observation = _complete_runtime_observation()
              runtime_observation["companion_calls"]["high_first"]["after"]["sol"]["external_mixed_weighted_measure_calls"] = 1
              gate = observation._runtime_observation_gate({"provenance": {observation._EXTENSION_KEY: runtime_observation}})
              assert gate["sol_research_receipts_complete"] is True
              assert gate["sol_research_zero"] is False
              assert gate["runtime_contract_complete"] is False


          def test_runtime_gate_rejects_missing_weighted_mixed_receipt():
              runtime_observation = _complete_runtime_observation()
              del runtime_observation["companion_calls"]["probe"]["before"]["sol"]["external_mixed_weighted_measure_calls"]
              gate = observation._runtime_observation_gate({"provenance": {observation._EXTENSION_KEY: runtime_observation}})
              assert gate["sol_research_receipts_complete"] is False
              assert gate["sol_research_zero"] is False
              assert gate["runtime_contract_complete"] is False
          '''
          p.write_text(s)

          p = Path("docs/FIRST_HIGH_STAGE_GATED_IMPLEMENTATION.md")
          s = p.read_text()
          s = s.replace("`capture_mib`, 256 MiB by default", "`capture_mib`, 512 MiB by default")
          s = s.replace("Leave `strict_provenance=true` and `capture_mib=256` initially.", "Leave `strict_provenance=true` and `capture_mib=512` for the controlled 44→64 run.")
          note = '''## CUDA O/C gate repair after run 00450

          Run 00450 reached 254,660,608 captured bytes under the 256 MiB budget and
          dropped four target-grid high-stage snapshots, so the controlled default is
          now 512 MiB. Capture truncation remains a hard failure.

          The same run exposed a diagnostic boundary distinction: `build_handoff_state`
          copies carried sampler audio byte-for-byte into `target_raw`, while the
          `SAMPLER_SAMPLE` boundary observed later is reconstructed through Flow's
          `_noise_argument` inverse and Core floating-point `noise_scaling`. The report
          therefore retains bitwise equality as evidence but gates that reconstructed
          boundary using an explicit dtype-scaled round-trip tolerance. Material audio
          changes still fail. This changes no production sampler behavior and does not
          weaken exact protected-output requirements.

          Active Sol runtime snapshots also carried the relevant weighted/Mixed-Grid
          counters while the base recorder searched a static model-options snapshot.
          The runtime gate now requires every selected Sol receipt to be present and
          zero, including weighted-measure counters; missing is not treated as zero.

          '''
          marker = "## Controlled O acceptance criteria\n"
          s = one(s, marker, note + marker, "00450 adaptation section")
          s = s.replace(
              "- exact carried-audio equality;",
              "- byte-exact handoff audio ownership in source plus reconstructed high-entry audio within the declared dtype tolerance; bitwise equality remains reported separately;",
          )
          p.write_text(s)
          PY
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Format and validate focused repair
        run: |
          ruff format h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py
          ruff check h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py
          ruff format --check h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py
          pytest -q tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py
      - name: Commit source repair and remove temporary workflows
        run: |
          rm -f .github/workflows/repair-pr41-observer-gates.yml .github/workflows/repair-pr41-observer-gates-v2.yml .github/workflows/repair-pr41-observer-gates-v3.yml
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add -A
          git commit -m "Fix CUDA O/C observer gate semantics"
          git push origin HEAD:mirror/pr41-observer-gate-repair-20260914
