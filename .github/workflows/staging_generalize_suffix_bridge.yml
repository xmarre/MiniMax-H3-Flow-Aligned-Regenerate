name: staging generalized suffix bridge

on:
  push:
    branches: [staging/release-v0.3.0-20260905]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: staging/release-v0.3.0-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply generalized bridge patch
        shell: bash
        run: |
          sed -i 's/if count != 1:/if count < 1:/' .github/staging_generalize_suffix_bridge.py
          python .github/staging_generalize_suffix_bridge.py
          python .github/staging_generalize_followup.py
      - name: Format and validate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
          ruff format h3_flow_regenerate tests
          ruff check --fix h3_flow_regenerate tests
          ruff format --check h3_flow_regenerate tests
          ruff check h3_flow_regenerate tests
          pytest -q
          python -m compileall -q h3_flow_regenerate tests
          git diff --check
      - name: Commit and push validated production code
        shell: bash
        run: |
          git config user.name xmarre
          git config user.email 54859656+xmarre@users.noreply.github.com
          git add h3_flow_regenerate tests
          git commit -m "Generalize validated Continuum suffix DC bridge"
          git push origin HEAD:staging/release-v0.3.0-20260905
