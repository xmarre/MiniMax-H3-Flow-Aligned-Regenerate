name: R VDN telemetry autopatch

on:
  push:
    branches:
      - mirror/same-state-high-replay-20260914
    paths:
      - .github/workflows/r-vdn-telemetry-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/same-state-high-replay-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]' ruff
      - name: Add read-only VDN retained-state receipts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("h3_flow_regenerate/execution_contract_runtime_observation.py")
          text = path.read_text(encoding="utf-8")
          marker = '''def _vdn_runtime_snapshot(executor: Any) -> list[dict[str, Any]]:\n'''
          addition = '''_MAX_VDN_CACHE_KEYS = 16\n_VDN_CACHE_FIELDS = (\n    ("scan", "_scan"),\n    ("delta", "_delta"),\n    ("plans", "_plans"),\n    ("kv", "_kv"),\n    ("activations", "_activations"),\n)\n\n\ndef _vdn_retained_cache_snapshot(resources: Any) -> dict[str, Any]:\n    """Describe bounded cache topology without reading or hashing scratch tensors."""\n    if resources is None:\n        return {}\n    result: dict[str, Any] = {}\n    for label, attribute in _VDN_CACHE_FIELDS:\n        mapping = getattr(resources, attribute, None)\n        keys = getattr(mapping, "keys", None)\n        if not callable(keys):\n            continue\n        values = list(keys())\n        result[label] = {\n            "count": len(values),\n            "limit": _MAX_VDN_CACHE_KEYS,\n            "truncated": len(values) > _MAX_VDN_CACHE_KEYS,\n            "keys": [_provenance.safe_value(value) for value in values[:_MAX_VDN_CACHE_KEYS]],\n        }\n    return result\n\n\ndef _vdn_prefetch_snapshot(resources: Any) -> dict[str, Any] | None:\n    """Observe VDN's retained one-block prefetch lifecycle without consuming it."""\n    if resources is None:\n        return None\n    prefetcher = getattr(resources, "_prefetcher", None)\n    if prefetcher is None:\n        return {"present": False}\n    future = getattr(prefetcher, "_future", None)\n    done = getattr(future, "done", None)\n    return {\n        "present": True,\n        "generation": _provenance.safe_value(getattr(prefetcher, "_generation", None)),\n        "target": _provenance.safe_value(getattr(prefetcher, "_index", None)),\n        "future_present": future is not None,\n        "future_done": bool(done()) if callable(done) else None,\n    }\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("VDN snapshot insertion target was not unique")
          text = text.replace(marker, addition + marker, 1)

          old = '''                    "runtime_pool_generation": _provenance.safe_value(generation),\n                    "retained_counts": retained_counts() if callable(retained_counts) else None,\n'''
          new = '''                    "runtime_pool_generation": _provenance.safe_value(generation),\n                    "retained_counts": retained_counts() if callable(retained_counts) else None,\n                    "retained_cache_keys": _vdn_retained_cache_snapshot(resources),\n                    "prefetch": _vdn_prefetch_snapshot(resources),\n'''
          if text.count(old) != 1:
              raise SystemExit("VDN snapshot field target was not unique")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_execution_contract_runtime_observation.py")
          tests = test_path.read_text(encoding="utf-8")
          old = '''    resources = SimpleNamespace(retain=True, retained_counts=lambda: {"kv": 1})\n    state.runtime = SimpleNamespace(current=lambda: resources)\n'''
          new = '''    future = SimpleNamespace(done=lambda: False)\n    prefetcher = SimpleNamespace(_generation=4, _index=(0, "cuda:0", torch.bfloat16), _future=future)\n    resources = SimpleNamespace(\n        retain=True,\n        retained_counts=lambda: {"kv": 1},\n        _scan={},\n        _delta={},\n        _plans={(10, 42, 2, 16): object()},\n        _kv={("cuda:0", torch.bfloat16, 56, 128): object()},\n        _activations={},\n        _prefetcher=prefetcher,\n    )\n    state.runtime = SimpleNamespace(current=lambda: resources)\n'''
          if tests.count(old) != 1:
              raise SystemExit("VDN runtime test fixture target was not unique")
          tests = tests.replace(old, new, 1)
          old = '''    assert snapshot[0]["runtime_pool_active"] is True\n    assert snapshot[0]["retained_counts"] == {"kv": 1}\n'''
          new = '''    assert snapshot[0]["runtime_pool_active"] is True\n    assert snapshot[0]["retained_counts"] == {"kv": 1}\n    assert snapshot[0]["retained_cache_keys"]["plans"]["count"] == 1\n    assert snapshot[0]["retained_cache_keys"]["kv"]["count"] == 1\n    assert snapshot[0]["prefetch"]["present"] is True\n    assert snapshot[0]["prefetch"]["generation"] == 4\n    assert snapshot[0]["prefetch"]["future_present"] is True\n    assert snapshot[0]["prefetch"]["future_done"] is False\n'''
          if tests.count(old) != 1:
              raise SystemExit("VDN runtime test assertions target was not unique")
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding="utf-8")

          replay_test = Path("tests/test_same_state_high_replay.py")
          replay_tests = replay_test.read_text(encoding="utf-8")
          marker = '''\ndef test_checkpoint_identity_hashes_exact_file_and_rejects_changed_stat(tmp_path: Path):\n'''
          addition = '''\ndef test_vdn_policy_excludes_retained_pool_contents_from_attribution_equality():\n    policy = replay._vdn_policy(\n        [\n            {\n                "capture": "state",\n                "state_type": "vdn_h3.hybrid.VDNState",\n                "owner_wrapper": {"module": "vdn_h3.hybrid", "qualname": "wrap"},\n                "layout_active": True,\n                "layout": {"num_frames": 52},\n                "retain_buffers": True,\n                "runtime_pool_retain": True,\n                "runtime_pool_generation": 7,\n                "retained_counts": {"plans": 3, "kv": 1},\n                "retained_cache_keys": {"plans": {"count": 3}},\n                "prefetch": {"present": True, "generation": 7, "target": [0, "cuda:0"]},\n            }\n        ]\n    )\n    assert policy[0]["retain_buffers"] is True\n    assert policy[0]["runtime_pool_retain"] is True\n    assert "runtime_pool_generation" not in policy[0]\n    assert "retained_counts" not in policy[0]\n    assert "retained_cache_keys" not in policy[0]\n    assert "prefetch" not in policy[0]\n\n\n'''
          if replay_tests.count(marker) != 1:
              raise SystemExit("R VDN policy test insertion target was not unique")
          replay_tests = replay_tests.replace(marker, addition + marker, 1)
          replay_test.write_text(replay_tests, encoding="utf-8")
          PY
      - run: ruff format h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py tests/test_same_state_high_replay.py
      - run: ruff check h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py tests/test_same_state_high_replay.py
      - run: pytest -q tests/test_execution_contract_runtime_observation.py tests/test_same_state_high_replay.py
      - name: Commit hardened diagnostic and remove one-shot workflow
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git rm .github/workflows/r-vdn-telemetry-autopatch.yml
          git add h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py tests/test_same_state_high_replay.py
          git diff --cached --check
          git commit -m "Expose retained VDN state in replay diagnostics"
          git push origin HEAD:mirror/same-state-high-replay-20260914
