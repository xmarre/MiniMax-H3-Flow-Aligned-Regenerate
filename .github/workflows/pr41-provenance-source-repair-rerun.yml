name: Rerun replay provenance source repair

on:
  push:
    branches:
      - mirror/pr41-replay-provenance-equivalence-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr41-replay-provenance-equivalence-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' build ruff
      - name: Reuse validated patch driver and apply Ruff correction
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr41-provenance-source-repair.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = workflow[start:end]
          lines = script.splitlines()
          indent = min(len(line) - len(line.lstrip()) for line in lines if line.strip())
          script = "\n".join(line[indent:] for line in lines)
          exec(compile(script, 'provenance-source-repair-driver', 'exec'), {})

          path = Path('h3_flow_regenerate/same_state_high_replay.py')
          text = path.read_text()
          old = 'enumerate(zip(a, b))'
          new = 'enumerate(zip(a, b, strict=False))'
          if old not in text:
              raise SystemExit('zip strict correction anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: ruff format h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: ruff check h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: pytest -q tests/test_same_state_high_replay.py
      - run: python -m compileall -q h3_flow_regenerate
      - name: Commit validated source repair only
        run: |
          git config user.name xmarre
          git config user.email 54859656+xmarre@users.noreply.github.com
          git add h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
          git commit -m 'Fix cold replay provenance equivalence gate'
          git push origin HEAD:mirror/pr41-replay-provenance-equivalence-20260915
