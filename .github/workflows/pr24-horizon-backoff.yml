name: PR24 horizon backoff patch

on:
  push:
    branches: [mirror/pr24-horizon-backoff]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-horizon-backoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 00314 horizon-backoff redesign
        run: python .github/scripts/pr24_horizon_backoff.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
      - name: Format and validate focused repair
        run: |
          ruff format h3_flow_regenerate/source_trajectory_bridge.py tests/test_source_trajectory_bridge.py
          ruff check h3_flow_regenerate/source_trajectory_bridge.py tests/test_source_trajectory_bridge.py
          ruff format --check h3_flow_regenerate/source_trajectory_bridge.py tests/test_source_trajectory_bridge.py
          pytest -q tests/test_source_trajectory_bridge.py tests/test_mixed_grid.py tests/test_representation_bridge.py
      - name: Commit patch
        run: |
          git config user.name 'xmarre'
          git config user.email '54859656+xmarre@users.noreply.github.com'
          git add h3_flow_regenerate/source_trajectory_bridge.py tests/test_source_trajectory_bridge.py docs/mixed-grid-seam-repair.md
          if ! git diff --cached --quiet; then
            git commit -m 'Back off unverified Mixed-Grid source horizons'
            git push origin HEAD:mirror/pr24-horizon-backoff
          fi
