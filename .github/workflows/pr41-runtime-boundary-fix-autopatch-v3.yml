name: PR41 runtime-boundary diagnostic fix v3

on:
  push:
    branches:
      - mirror/pr41-runtime-boundary-fix-20260914
    paths:
      - .github/workflows/pr41-runtime-boundary-fix-autopatch-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr41-runtime-boundary-fix-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]' ruff
      - name: Reapply validated semantic patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('.github/workflows/pr41-runtime-boundary-fix-autopatch-v2.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = lines.index('      - name: Apply diagnostic boundary corrections')
          run_index = lines.index('        run: |', start)
          body = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - ') and not line.startswith('          '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          subprocess.run(['bash', '-e', '-c', script], check=True)
          PY
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_execution_contract_diagnostics.py')
          text = path.read_text(encoding='utf-8')
          old = '    state_packed, _ = pack_streams((state_video, audio))\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one dead state_packed fixture, found {text.count(old)}')
          path.write_text(text.replace(old, '    _state_packed, _ = pack_streams((state_video, audio))\n', 1), encoding='utf-8')
          PY
      - run: ruff format h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py
      - run: ruff check h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py
      - run: pytest -q tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py
      - name: Commit validated fix and remove temporary workflows
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git rm .github/workflows/pr41-runtime-boundary-fix-autopatch.yml .github/workflows/pr41-runtime-boundary-fix-autopatch-v2.yml .github/workflows/pr41-runtime-boundary-fix-autopatch-v3.yml
          git add h3_flow_regenerate/execution_contract_diagnostics.py h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_diagnostics.py tests/test_execution_contract_runtime_observation.py
          git commit -m "Fix first-high diagnostic runtime boundaries"
          git push origin HEAD:mirror/pr41-runtime-boundary-fix-20260914
