name: staging fix Continuum bridge docs

on:
  push:
    branches: [staging/remove-target-input-dc-bridge-20260905]
    paths:
      - .github/fix_continuum_bridge_docs.py
      - .github/workflows/staging_fix_continuum_bridge_docs.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: staging/remove-target-input-dc-bridge-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply documentation correction
        run: python .github/fix_continuum_bridge_docs.py
      - name: Validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
          ruff format --check h3_flow_regenerate tests
          ruff check h3_flow_regenerate tests
          pytest -q
          python -m compileall -q h3_flow_regenerate tests
          git diff --check
      - name: Commit corrected documentation
        run: |
          git config user.name xmarre
          git config user.email 54859656+xmarre@users.noreply.github.com
          git add docs/MIXED_GRID_CONTINUUM.md docs/TARGET_SPARSE_CONTINUUM.md
          git commit -m "Keep seam bridge documentation Continuum-specific"
          git push origin HEAD:staging/remove-target-input-dc-bridge-20260905
