name: Format joint bridge

on:
  push:
    branches:
      - mirror/pr32-joint-overlap-20260912

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr32-joint-overlap-20260912
      - name: Run Ruff formatter and remove helper
        run: |
          python -m pip install 'ruff>=0.11'
          ruff format h3_flow_regenerate/representation_bridge.py
          rm .github/workflows/format_joint_bridge.yml
          git diff --check
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add -A
          git commit -m "Format joint overlap geometry bridge"
          git push origin HEAD:mirror/pr32-joint-overlap-20260912
