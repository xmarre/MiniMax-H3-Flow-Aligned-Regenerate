name: PR32 00390 helper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr32-00390-persistent-rebase-20260912
          fetch-depth: 0
      - name: Patch runtime telemetry and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("h3_flow_regenerate/runtime.py")
          text = path.read_text()
          old = '''            binding.metrics.event(\n                "mixed_grid_representation_bridge",\n                legacy_option_name="suffix_geometric_bridge",\n                authoritative_prefix_modified=False,\n                later_suffix_extrapolated=False,\n                **representation_metrics,\n            )'''
          new = '''            binding.metrics.event(\n                "mixed_grid_representation_bridge",\n                legacy_option_name="suffix_geometric_bridge",\n                authoritative_prefix_modified=False,\n                later_suffix_extrapolated=bool(\n                    representation_metrics["suffix_representation_bridge_accepted"]\n                ),\n                **representation_metrics,\n            )'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one representation telemetry anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/pr32_00390_helper.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/runtime.py
          git commit -m "Report persistent suffix extrapolation honestly"
          git push origin HEAD:mirror/pr32-00390-persistent-rebase-20260912
