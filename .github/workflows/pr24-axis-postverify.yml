name: PR24 per-axis post-verification patch

on:
  push:
    branches: [mirror/pr24-axis-postverify]
    paths: [.github/workflows/pr24-axis-postverify.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-axis-postverify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 00311 per-axis verification redesign
        run: |
          sed -i 's/## Current source repair/## Source-trajectory repair/' .github/scripts/pr24_axis_postverify.py
          python .github/scripts/pr24_axis_postverify.py
      - name: Validate focused repair
        run: |
          python -m pip install -e '.[test]' build
          ruff check h3_flow_regenerate/source_trajectory_bridge.py tests/test_source_trajectory_bridge.py
          ruff format --check h3_flow_regenerate/source_trajectory_bridge.py tests/test_source_trajectory_bridge.py
          pytest -q tests/test_source_trajectory_bridge.py tests/test_mixed_grid.py
      - name: Commit patch
        run: |
          git config user.name xmarre
          git config user.email 54859656+xmarre@users.noreply.github.com
          git add h3_flow_regenerate/source_trajectory_bridge.py tests/test_source_trajectory_bridge.py docs/mixed-grid-seam-repair.md
          git commit -m "Verify Mixed-Grid source repair per axis"
          git push origin HEAD:mirror/pr24-axis-postverify
