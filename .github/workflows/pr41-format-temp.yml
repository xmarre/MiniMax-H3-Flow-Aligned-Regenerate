name: PR41 format temporary

on:
  push:
    branches:
      - mirror/first-high-contract-implementation-20260914

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/first-high-contract-implementation-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'ruff==0.16.7'
      - name: Format PR41 runtime observation files
        run: |
          ruff format h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py
          ruff check h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/execution_contract_runtime_observation.py tests/test_execution_contract_runtime_observation.py
          git rm .github/workflows/pr41-format-temp.yml
          git commit -m 'Format runtime observation diagnostics'
          git push origin HEAD:mirror/first-high-contract-implementation-20260914
