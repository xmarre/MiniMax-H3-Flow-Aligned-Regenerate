name: tmp-pr30-ci-test-fix

on:
  push:
    branches:
      - mirror/pr30-weighted-runtime-activation-fix2-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporary PR30 CI test reconciliation harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr30-weighted-runtime-activation-fix2-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile explicit legacy-profile test with new profile contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_mixed_grid.py')
          text = path.read_text()
          old = '''    ambiguous = MixedGridPlan(
        torch.randn(1, 24, 2, 8, 12),
        7,
        4,
        6,
        measure_profile=MIXED_GRID_MEASURE_PROFILE_LEGACY,
    )
    with pytest.raises(ValueError, match="requires the released attention_measure control"):
        mixed_attention_measure_profile(ambiguous)
'''
          new = '''    explicit_legacy = MixedGridPlan(
        torch.randn(1, 24, 2, 8, 12),
        7,
        4,
        6,
        measure_profile=MIXED_GRID_MEASURE_PROFILE_LEGACY,
    )
    assert mixed_attention_measure_profile(explicit_legacy) == MIXED_GRID_MEASURE_PROFILE_LEGACY
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale ambiguity assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m pip install -e '.[test]' >/dev/null
          python -m pytest -q tests/test_attention_measure.py tests/test_mixed_grid.py tests/test_target_sparse_node.py
          python -m compileall -q h3_flow_regenerate tests
      - name: Commit reconciled tree and remove temporary harness
        shell: bash
        run: |
          rm .github/workflows/tmp-pr30-ci-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile explicit measure-profile regression coverage"
          git push origin HEAD:mirror/pr30-weighted-runtime-activation-fix2-20260911
