name: Apply PR24 final lint fix

on:
  push:
    branches: [mirror/pr24-source-trajectory-pre-upscale]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-source-trajectory-pre-upscale
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_mixed_grid.py")
          text = path.read_text()
          old = "    from h3_flow_regenerate.geometry import unpack_streams\n"
          if text.count(old) != 1:
              raise RuntimeError(f"expected one unused import, found {text.count(old)}")
          path.write_text(text.replace(old, "", 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-pr24-final-lint-fix.yml
          git add tests/test_mixed_grid.py
          git commit -m "Remove stale Mixed-Grid test import"
          git push origin HEAD:mirror/pr24-source-trajectory-pre-upscale
