name: Apply PR24 source-trajectory patch

on:
  push:
    branches:
      - mirror/pr24-source-trajectory-pre-upscale

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-source-trajectory-pre-upscale
          fetch-depth: 0
      - name: Apply deterministic source edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one patch target in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "h3_flow_regenerate/source_trajectory_bridge.py",
              '''    p = int(prefix_t)\n    if not 3 <= p < int(video.shape[2]) - 1:\n        raise ValueError("source trajectory bridge requires motion history plus generated suffix")\n    if not bool(torch.isfinite(video).all()):\n        raise RuntimeError("source trajectory bridge input contains NaN or Inf")\n    if not isinstance(requested, bool):\n        raise TypeError("source trajectory bridge requested flag must be boolean")\n    if not requested:\n        return video, disabled_source_trajectory_bridge_metrics(prefix_t=p)\n\n    started = time.perf_counter()\n''',
              '''    p = int(prefix_t)\n    temporal = int(video.shape[2])\n    if not 1 <= p < temporal:\n        raise ValueError("source trajectory bridge requires a non-empty prefix and suffix")\n    if not bool(torch.isfinite(video).all()):\n        raise RuntimeError("source trajectory bridge input contains NaN or Inf")\n    if not isinstance(requested, bool):\n        raise TypeError("source trajectory bridge requested flag must be boolean")\n    if not requested:\n        return video, disabled_source_trajectory_bridge_metrics(prefix_t=p)\n    if p < 3 or p >= temporal - 1:\n        metrics = disabled_source_trajectory_bridge_metrics(prefix_t=p, requested=True)\n        metrics["source_trajectory_bridge_reason"] = "insufficient_source_motion_window"\n        return video, metrics\n\n    started = time.perf_counter()\n''',
          )

          replace_once(
              "h3_flow_regenerate/runtime.py",
              '''from .sigma import H3_AUDIO_SHIFT, H3_VIDEO_SHIFT, audio_sigma, normalized_coordinate\nfrom .target_sparse import TARGET_SPARSE_CONTRACT_KEY, build_target_sparse_plan, target_sparse_contract\n''',
              '''from .sigma import H3_AUDIO_SHIFT, H3_VIDEO_SHIFT, audio_sigma, normalized_coordinate\nfrom .source_trajectory_bridge import apply_source_trajectory_bridge\nfrom .target_sparse import TARGET_SPARSE_CONTRACT_KEY, build_target_sparse_plan, target_sparse_contract\n''',
          )

          replace_once(
              "h3_flow_regenerate/runtime.py",
              '''            clean_video[:, :, : mixed_plan.prefix_t] = resize_spatial_5d(\n                mixed_plan.prefix.to(clean_video), source_h, source_w, mode="bicubic"\n            )\n            source_x0 = pack_streams((clean_video, clean_audio))[0]\n''',
              '''            clean_video[:, :, : mixed_plan.prefix_t] = resize_spatial_5d(\n                mixed_plan.prefix.to(clean_video), source_h, source_w, mode="bicubic"\n            )\n            source_bridge_requested = bool(getattr(config, "suffix_geometric_bridge", False))\n            clean_video, source_trajectory_metrics = apply_source_trajectory_bridge(\n                clean_video,\n                mixed_plan.prefix_t,\n                requested=source_bridge_requested,\n            )\n            binding.metrics.event(\n                "mixed_grid_source_trajectory_bridge",\n                legacy_option_name="suffix_geometric_bridge",\n                authoritative_source_prefix_modified=False,\n                later_suffix_extrapolated=False,\n                learned_upscaler_input_modified=bool(\n                    source_trajectory_metrics["source_trajectory_bridge_accepted"]\n                ),\n                **source_trajectory_metrics,\n            )\n            source_x0 = pack_streams((clean_video, clean_audio))[0]\n''',
          )

          replace_once(
              "h3_flow_regenerate/runtime.py",
              '''            representation_requested = bool(getattr(config, "suffix_geometric_bridge", False))\n            if representation_requested:\n                corrected_clean, representation_metrics = apply_suffix_representation_bridge(\n                    learned_clean,\n                    exact_prefix,\n                    requested=True,\n                )\n            else:\n                corrected_clean = learned_clean\n                representation_metrics = disabled_suffix_representation_bridge_metrics(\n                    prefix_t=mixed_plan.prefix_t,\n                    requested=False,\n                )\n''',
              '''            representation_option_requested = bool(getattr(config, "suffix_geometric_bridge", False))\n            source_trajectory_accepted = bool(\n                source_trajectory_metrics["source_trajectory_bridge_accepted"]\n            )\n            representation_requested = representation_option_requested and source_trajectory_accepted\n            if representation_requested:\n                corrected_clean, representation_metrics = apply_suffix_representation_bridge(\n                    learned_clean,\n                    exact_prefix,\n                    requested=True,\n                )\n            else:\n                corrected_clean = learned_clean\n                representation_metrics = disabled_suffix_representation_bridge_metrics(\n                    prefix_t=mixed_plan.prefix_t,\n                    requested=representation_option_requested,\n                )\n                if representation_option_requested and not source_trajectory_accepted:\n                    representation_metrics["suffix_representation_bridge_reason"] = (\n                        "source_trajectory_not_authorized"\n                    )\n''',
          )

          replace_once(
              "h3_flow_regenerate/runtime.py",
              '''                transfer_mode="learned_3d_suffix",\n                **representation_metrics,\n''',
              '''                transfer_mode="learned_3d_suffix",\n                source_trajectory_bridge_requested=source_trajectory_metrics[\n                    "source_trajectory_bridge_requested"\n                ],\n                source_trajectory_bridge_accepted=source_trajectory_metrics[\n                    "source_trajectory_bridge_accepted"\n                ],\n                source_trajectory_bridge_reason=source_trajectory_metrics[\n                    "source_trajectory_bridge_reason"\n                ],\n                source_trajectory_bridge_tokens_corrected=source_trajectory_metrics[\n                    "source_trajectory_bridge_tokens_corrected"\n                ],\n                source_trajectory_axis_authorized=source_trajectory_metrics.get(\n                    "source_trajectory_axis_authorized", [False] * 4\n                ),\n                source_trajectory_residual_reduction_ratio=source_trajectory_metrics.get(\n                    "source_trajectory_residual_reduction_ratio", [None] * 4\n                ),\n                **representation_metrics,\n''',
          )

          replace_once(
              "h3_flow_regenerate/target_sparse_node.py",
              '''        "The validated one-token DC bridge remains enabled by default. The optional legacy-named "\n        "suffix_geometric_bridge now enables an experimental exact-overlap representation bridge: it "\n        "transplants the measured non-DC learned-prefix replacement residual onto only the first suffix "\n        "token before refinement. It remains off by default pending decoded-media validation."\n''',
              '''        "The validated one-token DC bridge remains enabled by default. The optional legacy-named "\n        "suffix_geometric_bridge now enables an experimental two-stage seam repair: first it measures and "\n        "closes an independently strong, temporally safe geometric residual on the genuine source-grid clean "\n        "trajectory before learned upscaling; then it reconciles the exact-prefix representation splice on "\n        "the first target-grid suffix token. It remains off by default pending decoded-media validation."\n''',
          )

          replace_once(
              "h3_flow_regenerate/target_sparse_node.py",
              '''                    "Experimental Mixed-Grid exact-overlap representation bridge (legacy input name kept "\n                    "for workflow compatibility). It measures the discarded learned-upscaler prefix against "\n                    "the authoritative exact prefix on the same final overlap frame, transfers only that "\n                    "zero-mean structural residual to the first generated suffix token, and leaves the DC "\n                    "component to suffix_dc_bridge. With both enabled, the pre-refinement boundary exactly "\n                    "preserves the upscaler's native learned-prefix→suffix transition. No prefix warp, fade, "\n                    "extra H3 call, audio/noise/mask/conditioning change, or later-suffix extrapolation."\n''',
              '''                    "Experimental Mixed-Grid source-trajectory + exact-overlap repair (legacy input name "\n                    "kept for workflow compatibility). Before the learned 3D upscaler it measures the genuine "\n                    "source-grid clean continuation against robust recent prefix motion, requires strong "\n                    "source evidence plus a measured recovering/persistent temporal state, and corrects only "\n                    "the authorized early suffix tokens. If that source correction is accepted, the target "\n                    "exact-overlap bridge then preserves the upscaler's native prefix→suffix transition while "\n                    "suffix_dc_bridge owns the DC component. No protected-prefix warp, handcrafted fade, "\n                    "extra H3 call, audio/noise/mask/conditioning change, or unmeasured later-suffix correction."\n''',
          )

          Path("tests/test_source_trajectory_bridge.py").write_text('''from __future__ import annotations\n\nimport math\n\nimport pytest\nimport torch\nfrom torch.nn import functional as F\n\nfrom h3_flow_regenerate.source_trajectory_bridge import (\n    _MIN_SOURCE_EVIDENCE,\n    apply_source_trajectory_bridge,\n)\n\n\ndef _texture() -> torch.Tensor:\n    torch.manual_seed(77)\n    frame = torch.randn(1, 24, 32, 40)\n    return F.avg_pool2d(F.pad(frame, (2, 2, 2, 2), mode="reflect"), 5, stride=1)\n\n\ndef _warp(frame: torch.Tensor, *, sy: float) -> torch.Tensor:\n    b, _c, h, w = frame.shape\n    theta = frame.new_tensor([[1.0, 0.0, 0.0], [0.0, sy, 0.0]], dtype=torch.float32)\n    grid = F.affine_grid(theta[None].expand(b, -1, -1), frame.shape, align_corners=False)\n    return F.grid_sample(frame, grid, mode="bilinear", padding_mode="border", align_corners=False)\n\n\ndef _recovering_video() -> torch.Tensor:\n    frame = _texture()\n    prefix = [frame.clone() for _ in range(6)]\n    # Registration of the first suffix against an identity-motion prefix is ~0.9775 sy.\n    first_suffix = _warp(frame, sy=1.0 / 0.975)\n    return torch.stack(prefix + [first_suffix, frame.clone(), frame.clone()], dim=2)\n\n\ndef test_recovering_source_sy_is_closed_before_upscale_and_tail_is_exact():\n    video = _recovering_video()\n    before = video.clone()\n    corrected, report = apply_source_trajectory_bridge(video, 6, requested=True)\n\n    assert report["source_trajectory_bridge_accepted"] is True\n    assert report["source_trajectory_bridge_reason"] == "source_trajectory_residual_closed_before_upscale"\n    assert report["source_trajectory_axis_authorized"] == [False, True, False, False]\n    assert report["source_trajectory_temporal_profile"]["axis_mode"][1] == "recovering"\n    assert report["source_trajectory_motion_residual"]["axis_evidence_score"][1] > _MIN_SOURCE_EVIDENCE\n    assert report["source_trajectory_bridge_tokens_corrected"] == 1\n    assert report["source_trajectory_residual_reduction_ratio"][1] < 1.0\n    assert torch.equal(corrected[:, :, :6], before[:, :, :6])\n    assert not torch.equal(corrected[:, :, 6:7], before[:, :, 6:7])\n    assert torch.equal(corrected[:, :, 7:], before[:, :, 7:])\n    assert torch.equal(video, before)\n\n\ndef test_disabled_bridge_is_exact_object_noop():\n    video = _recovering_video()\n    corrected, report = apply_source_trajectory_bridge(video, 6, requested=False)\n    assert corrected is video\n    assert report["source_trajectory_bridge_accepted"] is False\n    assert report["source_trajectory_bridge_reason"] == "disabled"\n\n\n@pytest.mark.parametrize("prefix_t", [1, 2, 8])\ndef test_insufficient_motion_window_fails_safe(prefix_t):\n    video = torch.randn(1, 24, 9, 32, 40)\n    corrected, report = apply_source_trajectory_bridge(video, prefix_t, requested=True)\n    assert corrected is video\n    assert report["source_trajectory_bridge_accepted"] is False\n    assert report["source_trajectory_bridge_reason"] == "insufficient_source_motion_window"\n\n\ndef test_source_evidence_threshold_is_derived_from_existing_combined_gate():\n    assert _MIN_SOURCE_EVIDENCE == pytest.approx(2.5 / math.sqrt(2.0))\n''')

          # Integration ordering: the provider must receive the corrected source suffix, not merely a post-upscale repair.
          mixed = Path("tests/test_mixed_grid.py")
          text = mixed.read_text()
          anchor = '''def test_native_forward_uses_authoritative_prefix_and_real_suffix(monkeypatch, native):\n'''
          if anchor not in text:
              raise RuntimeError("mixed-grid integration test insertion anchor missing")
          integration = '''def test_source_trajectory_bridge_runs_before_learned_upscaler(monkeypatch):\n    import sys\n    from types import ModuleType, SimpleNamespace\n\n    from test_handoff import FakeLearnedProvider\n\n    import h3_flow_regenerate.runtime as runtime\n    from h3_flow_regenerate.geometry import unpack_streams\n    from h3_flow_regenerate.handoff import ProgressiveTargetInputConfig\n    from h3_flow_regenerate.runtime import FlowBinding, _run_progressive\n\n    fake = ModuleType("comfy")\n    fake.samplers = ModuleType("comfy.samplers")\n    fake.samplers.KSAMPLER = lambda function, **kw: SimpleNamespace(sampler_function=function, extra_options={})\n    monkeypatch.setitem(sys.modules, "comfy", fake)\n    monkeypatch.setitem(sys.modules, "comfy.samplers", fake.samplers)\n\n    packed, shapes, mask = inputs(t=9, prefix=6)\n    base = SimpleNamespace(process_latent_in=lambda value: value, diffusion_model=SimpleNamespace(blocks=[]))\n    guider = SimpleNamespace(\n        model_options={"transformer_options": {}},\n        model_patcher=SimpleNamespace(model=base),\n        conds={"positive": []},\n    )\n    binding = FlowBinding()\n    provider = FakeLearnedProvider()\n    config = ProgressiveTargetInputConfig(\n        source_latent_h=4,\n        source_latent_w=6,\n        exact_prefix_mode="mixed_grid_low_suffix",\n        transfer_mode="learned_3d",\n        learned_upscaler=provider,\n        suffix_geometric_bridge=True,\n    )\n    marker = 123.0\n\n    def bridge(video, prefix_t, *, requested):\n        assert requested is True\n        assert prefix_t == 6\n        corrected = video.clone()\n        corrected[:, :, prefix_t] += marker\n        return corrected, {\n            "source_trajectory_bridge_requested": True,\n            "source_trajectory_bridge_enabled": True,\n            "source_trajectory_bridge_accepted": True,\n            "source_trajectory_bridge_reason": "test",\n            "source_trajectory_bridge_prefix_t": prefix_t,\n            "source_trajectory_bridge_tokens_corrected": 1,\n            "source_trajectory_bridge_effective_active_temporal_length": 1,\n            "source_trajectory_bridge_applied_transforms": [],\n            "source_trajectory_bridge_applied_transform_sequence_length": 1,\n            "source_trajectory_bridge_applied_transforms_compact": False,\n            "source_trajectory_bridge_out_of_bounds_fraction": 0.0,\n            "source_trajectory_bridge_minimum_evidence": 0.0,\n            "source_trajectory_axis_authorized": [False, True, False, False],\n            "source_trajectory_residual_reduction_ratio": [None, 0.0, None, None],\n        }\n\n    monkeypatch.setattr(runtime, "apply_source_trajectory_bridge", bridge)\n\n    def execute(noise, latent, sampler, sigmas, call_mask, *args, latent_shapes):\n        stage = guider.model_options["transformer_options"]["h3_flow_stage"]\n        if stage == "high":\n            binding.metrics.event("model_call", actual=True)\n            return packed.clone()\n        if stage == "probe":\n            return latent.clone()\n        return latent / (1 - sigmas[-1])\n\n    sampler = SimpleNamespace(sampler_function=lambda: None, extra_options={})\n    _run_progressive(\n        execute,\n        guider,\n        binding,\n        config,\n        torch.randn_like(packed),\n        packed,\n        sampler,\n        torch.tensor([1.0, 0.9, 0.7, 0.4, 0.0]),\n        mask,\n        None,\n        True,\n        7,\n        list(shapes),\n    )\n    provider_input = provider.calls[0][0]\n    assert torch.count_nonzero(provider_input[:, :, 6] - marker) < provider_input[:, :, 6].numel()\n    source_events = [event for event in binding.metrics.events if event.kind == "mixed_grid_source_trajectory_bridge"]\n    assert len(source_events) == 1\n    assert source_events[0].fields["learned_upscaler_input_modified"] is True\n\n\n'''
          mixed.write_text(text.replace(anchor, integration + anchor, 1))
      - name: Remove one-shot patch workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr24-source-trajectory.yml
          git add h3_flow_regenerate/source_trajectory_bridge.py h3_flow_regenerate/runtime.py h3_flow_regenerate/target_sparse_node.py tests/test_source_trajectory_bridge.py tests/test_mixed_grid.py
          git commit -m "Move Mixed-Grid geometry correction before learned upscaling"
          git push origin HEAD:mirror/pr24-source-trajectory-pre-upscale
