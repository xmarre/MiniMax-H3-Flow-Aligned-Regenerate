name: PR24 doc sync

on:
  push:
    branches:
      - mirror/pr24-source-gate-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-source-gate-fix
      - name: Correct source authorization docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/mixed-grid-seam-repair.md')
          s = p.read_text()
          old = '''### Source-only evidence gate\n\nBefore the learned upscaler there is intentionally no independent target-grid observation. The earlier two-domain gate required a quadrature evidence score of `2.5`. The source-only stage therefore uses the equal-contribution per-domain equivalent:\n\n```text\nminimum_source_evidence = no transplanted two-domain scalar threshold\n```\n\nThis does not change the existing cross-grid constants elsewhere. It is a separate pre-upscale authorization gate, and evidence alone is not enough to apply a correction.\n'''
          new = '''### Source-only authorization\n\nBefore the learned upscaler there is intentionally no independent target-grid observation. The earlier `2.5` quadrature gate combined independent source- and target-domain evidence, so it is not transplanted into this source-only stage. Doing so would add a second magnitude threshold on top of the estimator/objective gates without an independent domain to justify it.\n\nA source axis is provisionally eligible only after it clears the estimator floor, objective-gain floor, and geometric safety bound above. Authorization then requires a safe state in the directly observed suffix transitions, and the applied warp must subsequently pass post-warp residual-reduction verification. `axis_evidence_score` remains diagnostic telemetry; it is not a standalone authorization threshold. Existing cross-grid evidence constants elsewhere are unchanged.\n'''
          if old not in s:
              raise SystemExit('mixed-grid-seam-repair source gate block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/MIXED_GRID_CONTINUUM.md')
          s = p.read_text()
          old = '''Because no independent target-domain observation exists before the upscaler, the source-only authorization threshold is the equal-contribution equivalent of the existing two-domain quadrature gate:\n\n```text\nno transplanted two-domain scalar threshold\n```\n\nEvidence alone cannot authorize a warp. Up to four genuine suffix transitions are measured to classify the residual as recovering or persistent. Recovering weights are derived from the measured cumulative state. Persistent correction is limited to token 0 plus the directly observed follow-up transitions; it is never extended over unmeasured later suffix tokens. There is no handcrafted fade.\n'''
          new = '''Because no independent target-domain observation exists before the upscaler, the earlier two-domain quadrature threshold is not reused as a source-only scalar gate. A source axis must instead clear the existing estimator floor, objective-gain floor, and safety bound; then directly observed suffix evolution must authorize a safe recovering or persistent state; finally the applied warp must strictly reduce the measured boundary residual. `axis_evidence_score` is retained for diagnostics only. Existing cross-grid thresholds elsewhere are unchanged.\n\nUp to four genuine suffix transitions are measured for temporal classification. Recovering weights are derived from the measured cumulative state. Persistent correction is limited to token 0 plus the directly observed follow-up transitions; it is never extended over unmeasured later suffix tokens. There is no handcrafted fade.\n'''
          if old not in s:
              raise SystemExit('MIXED_GRID_CONTINUUM source gate block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/pr24-doc-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Document source-only trajectory authorization"
          git push origin HEAD:mirror/pr24-source-gate-fix
