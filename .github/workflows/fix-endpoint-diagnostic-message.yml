name: Fix endpoint diagnostic message

on:
  push:
    branches:
      - mirror/endpoint-state-transport-diagnostic-20260911

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[endpoint-message-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fix policy-generic invariant message
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('h3_flow_regenerate/runtime.py')
          text = path.read_text()
          old = 'raise RuntimeError("velocity state transport lost the immutable accepted probe clean")'
          new = 'raise RuntimeError("state transport lost the immutable accepted probe clean")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Restore workflow file
        run: git checkout HEAD -- .github/workflows/fix-endpoint-diagnostic-message.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/runtime.py
          git commit -m "Fix endpoint diagnostic invariant message [endpoint-message-fixed]"
          git push origin HEAD:mirror/endpoint-state-transport-diagnostic-20260911
