name: Fix PR24 documentation step

on:
  push:
    branches: [mirror/pr24-source-trajectory-pre-upscale]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-source-trajectory-pre-upscale
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/MIXED_GRID_CONTINUUM.md")
          text = path.read_text()
          old = "The final restoration in step 10 is intentionally narrower than a tolerance check."
          new = "The final restoration in step 11 is intentionally narrower than a tolerance check."
          if text.count(old) != 1:
              raise RuntimeError(f"expected one stale step reference, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-pr24-doc-step.yml
          git add docs/MIXED_GRID_CONTINUUM.md
          git commit -m "Fix Mixed-Grid execution step reference"
          git push origin HEAD:mirror/pr24-source-trajectory-pre-upscale
