name: Diagnostic R preflight autopatch

on:
  push:
    branches:
      - mirror/same-state-high-replay-20260914
    paths:
      - .github/workflows/diag-r-preflight-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/same-state-high-replay-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Move checkpoint hashing to node preflight
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("h3_flow_regenerate/same_state_high_replay.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''@dataclass(slots=True)\nclass _CaptureState:\n    complete: deque[_ReplayMaterial] = field(default_factory=lambda: deque(maxlen=_MAX_BUNDLES))\n\n\n@dataclass(slots=True)\nclass _ReplayState:\n    manifest_path: str\n    manifest: dict[str, Any]\n    tensors: dict[str, torch.Tensor]\n    complete: deque[dict[str, Any]] = field(default_factory=lambda: deque(maxlen=_MAX_REPORTS))\n''',
                  '''@dataclass(slots=True)\nclass _CaptureState:\n    exact_checkpoint_identity: dict[str, Any]\n    complete: deque[_ReplayMaterial] = field(default_factory=lambda: deque(maxlen=_MAX_BUNDLES))\n\n\n@dataclass(slots=True)\nclass _ReplayState:\n    manifest_path: str\n    manifest: dict[str, Any]\n    tensors: dict[str, torch.Tensor]\n    exact_checkpoint_identity: dict[str, Any]\n    complete: deque[dict[str, Any]] = field(default_factory=lambda: deque(maxlen=_MAX_REPORTS))\n''',
              ),
              (
                  'def _material_from_record(record: _diag._Record, guider: Any) -> _ReplayMaterial:\n',
                  'def _material_from_record(\n    record: _diag._Record,\n    guider: Any,\n    exact_checkpoint_identity: dict[str, Any],\n) -> _ReplayMaterial:\n',
              ),
              (
                  '    exact_checkpoint = _checkpoint_identity(record.state.manifest)\n    tensor_hashes = {name: _tensor_sha256(value) for name, value in tensors.items()}\n',
                  '    tensor_hashes = {name: _tensor_sha256(value) for name, value in tensors.items()}\n',
              ),
              (
                  '        "exact_checkpoint_identity": exact_checkpoint,\n',
                  '        "exact_checkpoint_identity": exact_checkpoint_identity,\n',
              ),
              (
                  '    if isinstance(state, _CaptureState) and record is not None:\n        state.complete.append(_material_from_record(record, guider))\n',
                  '    if isinstance(state, _CaptureState) and record is not None:\n        state.complete.append(\n            _material_from_record(record, guider, state.exact_checkpoint_identity)\n        )\n',
              ),
              (
                  '    current_checkpoint = _checkpoint_identity(record.state.manifest)\n    if not _dict_equal(current_checkpoint, state.manifest.get("exact_checkpoint_identity")):\n        raise RuntimeError("same-state replay exact checkpoint identity differs from capture")\n',
                  '    if not _dict_equal(state.exact_checkpoint_identity, state.manifest.get("exact_checkpoint_identity")):\n        raise RuntimeError("same-state replay exact checkpoint identity changed after preflight")\n',
              ),
              (
                  '''def patch_same_state_capture(model: Any) -> tuple[Any, _CaptureState]:\n    state = (getattr(model, "model_options", None) or {}).get(_diag.DIAGNOSTIC_KEY)\n    if not isinstance(state, _diag._State):\n        raise RuntimeError("same-state replay capture must be applied after MiniMax H3 Execution Contract Diagnostics")\n    patched = model.clone()\n''',
                  '''def patch_same_state_capture(model: Any) -> tuple[Any, _CaptureState]:\n    state = (getattr(model, "model_options", None) or {}).get(_diag.DIAGNOSTIC_KEY)\n    if not isinstance(state, _diag._State):\n        raise RuntimeError("same-state replay capture must be applied after MiniMax H3 Execution Contract Diagnostics")\n    if not state.strict_provenance or not state.manifest.get("gate_complete"):\n        raise RuntimeError("same-state replay requires strict, complete installed-runtime provenance")\n    exact_checkpoint_identity = _checkpoint_identity(state.manifest)\n    patched = model.clone()\n''',
              ),
              (
                  '    capture = _CaptureState()\n',
                  '    capture = _CaptureState(exact_checkpoint_identity=exact_checkpoint_identity)\n',
              ),
              (
                  '''def patch_same_state_replay(model: Any, manifest_path: str) -> tuple[Any, _ReplayState]:\n    diagnostic = (getattr(model, "model_options", None) or {}).get(_diag.DIAGNOSTIC_KEY)\n    if not isinstance(diagnostic, _diag._State):\n        raise RuntimeError("same-state high replay must be applied after MiniMax H3 Execution Contract Diagnostics")\n    resolved, manifest, tensors = _load_bundle(manifest_path)\n    patched = model.clone()\n''',
                  '''def patch_same_state_replay(model: Any, manifest_path: str) -> tuple[Any, _ReplayState]:\n    diagnostic = (getattr(model, "model_options", None) or {}).get(_diag.DIAGNOSTIC_KEY)\n    if not isinstance(diagnostic, _diag._State):\n        raise RuntimeError("same-state high replay must be applied after MiniMax H3 Execution Contract Diagnostics")\n    if not diagnostic.strict_provenance or not diagnostic.manifest.get("gate_complete"):\n        raise RuntimeError("same-state replay requires strict, complete installed-runtime provenance")\n    resolved, manifest, tensors = _load_bundle(manifest_path)\n    exact_checkpoint_identity = _checkpoint_identity(diagnostic.manifest)\n    if not _dict_equal(exact_checkpoint_identity, manifest.get("exact_checkpoint_identity")):\n        raise RuntimeError("same-state replay exact checkpoint identity differs from capture")\n    patched = model.clone()\n''',
              ),
              (
                  '    state = _ReplayState(manifest_path=str(resolved), manifest=manifest, tensors=tensors)\n',
                  '''    state = _ReplayState(\n        manifest_path=str(resolved),\n        manifest=manifest,\n        tensors=tensors,\n        exact_checkpoint_identity=exact_checkpoint_identity,\n    )\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement target, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_same_state_high_replay.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''\ndef test_replay_source_has_no_progressive_or_upscaler_execution_path():\n'''
          addition = '''\ndef test_checkpoint_identity_is_hashed_only_during_node_preflight():\n    import inspect\n\n    assert "_checkpoint_identity(" in inspect.getsource(replay.patch_same_state_capture)\n    assert "_checkpoint_identity(" in inspect.getsource(replay.patch_same_state_replay)\n    assert "_checkpoint_identity(" not in inspect.getsource(replay._capture_wrapper)\n    assert "_checkpoint_identity(" not in inspect.getsource(replay._replay_wrapper)\n    assert "_checkpoint_identity(" not in inspect.getsource(replay._material_from_record)\n\n\n'''
          if addition.strip() in tests:
              raise SystemExit("preflight checkpoint test already present")
          if tests.count(marker) != 1:
              raise SystemExit("expected replay source test marker exactly once")
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - run: ruff format h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: ruff check h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - name: Commit patch
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
          git diff --cached --check
          git commit -m "Move replay checkpoint identity to preflight"
          git push origin HEAD:mirror/same-state-high-replay-20260914
