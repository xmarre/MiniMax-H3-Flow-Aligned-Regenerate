name: Diagnostic R preflight autopatch

on:
  push:
    branches:
      - mirror/same-state-high-replay-20260914
    paths:
      - .github/workflows/diag-r-preflight-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/same-state-high-replay-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]' ruff
      - name: Add cheap post-preflight checkpoint guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("h3_flow_regenerate/same_state_high_replay.py")
          text = path.read_text(encoding="utf-8")
          marker = '''    return {\n        "resolved_path": str(path),\n        "size": int(stat.st_size),\n        "mtime_ns": int(stat.st_mtime_ns),\n        "sha256": _sha256_file(path),\n    }\n\n\n_DROP_PROVENANCE = object()\n'''
          replacement = '''    return {\n        "resolved_path": str(path),\n        "size": int(stat.st_size),\n        "mtime_ns": int(stat.st_mtime_ns),\n        "sha256": _sha256_file(path),\n    }\n\n\ndef _assert_checkpoint_identity_unchanged(identity: dict[str, Any]) -> None:\n    """Fail before sampling if the checkpoint file changed after the preflight hash."""\n    raw_path = identity.get("resolved_path")\n    if not isinstance(raw_path, str) or not raw_path:\n        raise RuntimeError("same-state replay preflight checkpoint identity has no path")\n    try:\n        path = Path(raw_path).resolve(strict=True)\n        stat = path.stat()\n    except OSError as exc:\n        raise RuntimeError(f"same-state replay checkpoint path is not readable after preflight: {raw_path}") from exc\n    if not path.is_file():\n        raise RuntimeError("same-state replay checkpoint identity requires a regular file")\n    if str(path) != raw_path:\n        raise RuntimeError("same-state replay checkpoint path changed after preflight")\n    if int(stat.st_size) != int(identity.get("size", -1)):\n        raise RuntimeError("same-state replay checkpoint size changed after preflight")\n    if int(stat.st_mtime_ns) != int(identity.get("mtime_ns", -1)):\n        raise RuntimeError("same-state replay checkpoint mtime changed after preflight")\n\n\n_DROP_PROVENANCE = object()\n'''
          if text.count(marker) != 1:
              raise SystemExit("checkpoint helper insertion target was not unique")
          text = text.replace(marker, replacement, 1)

          marker = '''    record = _diag._ACTIVE.get()\n    result = executor(\n'''
          replacement = '''    record = _diag._ACTIVE.get()\n    if isinstance(state, _CaptureState):\n        _assert_checkpoint_identity_unchanged(state.exact_checkpoint_identity)\n    result = executor(\n'''
          if text.count(marker) != 1:
              raise SystemExit("capture wrapper guard target was not unique")
          text = text.replace(marker, replacement, 1)

          marker = '''    if not record.state.strict_provenance or not record.state.manifest.get("gate_complete"):\n        raise RuntimeError("same-state replay requires strict, complete installed-runtime provenance")\n    if not isinstance(options, dict):\n'''
          replacement = '''    if not record.state.strict_provenance or not record.state.manifest.get("gate_complete"):\n        raise RuntimeError("same-state replay requires strict, complete installed-runtime provenance")\n    _assert_checkpoint_identity_unchanged(state.exact_checkpoint_identity)\n    if not isinstance(options, dict):\n'''
          if text.count(marker) != 1:
              raise SystemExit("replay wrapper guard target was not unique")
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_same_state_high_replay.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''\ndef test_rebuild_trajectory_restores_declarative_guidance_samples():\n'''
          addition = '''\ndef test_checkpoint_identity_guard_rejects_file_change_after_preflight(tmp_path: Path):\n    checkpoint = tmp_path / "model.safetensors"\n    checkpoint.write_bytes(b"exact-model-bytes")\n    stat = checkpoint.stat()\n    provenance = {\n        "model": {\n            "checkpoint_stat": {\n                "resolved_path": str(checkpoint),\n                "size": stat.st_size,\n                "mtime_ns": stat.st_mtime_ns,\n            }\n        }\n    }\n    identity = replay._checkpoint_identity(provenance)\n    replay._assert_checkpoint_identity_unchanged(identity)\n\n    checkpoint.write_bytes(b"changed-model-bytes-longer")\n    try:\n        replay._assert_checkpoint_identity_unchanged(identity)\n    except RuntimeError as exc:\n        assert "changed after preflight" in str(exc)\n    else:  # pragma: no cover\n        raise AssertionError("checkpoint changed after preflight was accepted")\n\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit("checkpoint guard test insertion target was not unique")
          tests = tests.replace(marker, addition + marker, 1)

          old_assertion = '    assert "handoff_learned_upscale" not in source\n'
          new_assertion = '    assert "learned_upscaler" not in source\n'
          if tests.count(old_assertion) != 1:
              raise SystemExit("replay upscaler source assertion target was not unique")
          tests = tests.replace(old_assertion, new_assertion, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - run: ruff format h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: ruff check h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
      - run: pytest -q tests/test_same_state_high_replay.py
      - name: Commit patch
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
          git diff --cached --check
          git commit -m "Guard replay checkpoint identity after preflight"
          git push origin HEAD:mirror/same-state-high-replay-20260914
