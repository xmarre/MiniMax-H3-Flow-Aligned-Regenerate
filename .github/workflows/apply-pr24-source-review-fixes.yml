name: Apply PR24 source trajectory review fixes

on:
  push:
    branches:
      - mirror/pr24-source-trajectory-pre-upscale

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-source-trajectory-pre-upscale
          fetch-depth: 0
      - name: Apply deterministic review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected exactly one patch target in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "h3_flow_regenerate/source_trajectory_bridge.py",
              '''    if all(abs(state - boundary) <= floor for state in states[1:]):
        report.update(
            accepted=True,
            mode="persistent",
            reason="persistent_state_within_estimator_floor",
            active_tokens=suffix_length,
            applied_envelope={
                "kind": "constant",
                "value": 1.0,
                "active_tokens": suffix_length,
            },
        )
        return report
''',
              '''    if all(abs(state - boundary) <= floor for state in states[1:]):
        # Persistence is proven only through the contiguous follow-up transitions
        # we actually measured. Never project a constant correction beyond that
        # observed temporal window.
        observed_tokens = min(suffix_length, len(followup_signed_residuals) + 1)
        report.update(
            accepted=True,
            mode="persistent",
            reason="persistent_state_within_estimator_floor_observed_window",
            active_tokens=observed_tokens,
            applied_envelope={
                "kind": "constant",
                "value": 1.0,
                "active_tokens": observed_tokens,
                "measured_followup_transitions": len(followup_signed_residuals),
                "extrapolated_beyond_observation": False,
            },
        )
        return report
''',
          )

          replace_once(
              "h3_flow_regenerate/runtime.py",
              '''            representation_option_requested = bool(getattr(config, "suffix_geometric_bridge", False))
            source_trajectory_accepted = bool(
                source_trajectory_metrics["source_trajectory_bridge_accepted"]
            )
            representation_requested = representation_option_requested and source_trajectory_accepted
            if representation_requested:
                corrected_clean, representation_metrics = apply_suffix_representation_bridge(
                    learned_clean,
                    exact_prefix,
                    requested=True,
                )
            else:
                corrected_clean = learned_clean
                representation_metrics = disabled_suffix_representation_bridge_metrics(
                    prefix_t=mixed_plan.prefix_t,
                    requested=representation_option_requested,
                )
                if representation_option_requested and not source_trajectory_accepted:
                    representation_metrics["suffix_representation_bridge_reason"] = (
                        "source_trajectory_not_authorized"
                    )
''',
              '''            representation_requested = bool(getattr(config, "suffix_geometric_bridge", False))
            if representation_requested:
                corrected_clean, representation_metrics = apply_suffix_representation_bridge(
                    learned_clean,
                    exact_prefix,
                    requested=True,
                )
            else:
                corrected_clean = learned_clean
                representation_metrics = disabled_suffix_representation_bridge_metrics(
                    prefix_t=mixed_plan.prefix_t,
                    requested=False,
                )
''',
          )

          replace_once(
              "h3_flow_regenerate/target_sparse_node.py",
              '''        "suffix_geometric_bridge now enables an experimental two-stage seam repair: first it measures and "
        "closes an independently strong, temporally safe geometric residual on the genuine source-grid clean "
        "trajectory before learned upscaling; then it reconciles the exact-prefix representation splice on "
        "the first target-grid suffix token. It remains off by default pending decoded-media validation."
''',
              '''        "suffix_geometric_bridge now enables an experimental two-stage seam repair: it first attempts to "
        "close an independently strong, temporally safe geometric residual on the genuine source-grid clean "
        "trajectory before learned upscaling, and independently reconciles the exact-prefix representation "
        "splice on the first target-grid suffix token. It remains off by default pending decoded-media validation."
''',
          )

          replace_once(
              "h3_flow_regenerate/target_sparse_node.py",
              '''                    "source evidence plus a measured recovering/persistent temporal state, and corrects only "
                    "the authorized early suffix tokens. If that source correction is accepted, the target "
                    "exact-overlap bridge then preserves the upscaler's native prefix→suffix transition while "
                    "suffix_dc_bridge owns the DC component. No protected-prefix warp, handcrafted fade, "
''',
              '''                    "source evidence plus a measured recovering/persistent temporal state, and corrects only "
                    "the authorized, directly observed early suffix tokens. Independently, the target exact-overlap "
                    "bridge preserves the upscaler's native prefix→suffix transition while suffix_dc_bridge owns "
                    "the DC component. No protected-prefix warp, handcrafted fade, "
''',
          )

          test = Path("tests/test_source_trajectory_bridge.py")
          text = test.read_text()
          addition = '''\n\ndef test_persistent_source_state_is_limited_to_measured_window():\n    frame = _texture()\n    prefix = [frame.clone() for _ in range(6)]\n    shifted = _warp(frame, sy=1.0 / 0.975)\n    # Seven suffix tokens exceed the four-transition persistence observation\n    # window. Only token 0 plus those four directly measured follow-ups may be\n    # corrected; later suffix tokens must stay byte-identical.\n    video = torch.stack(prefix + [shifted.clone() for _ in range(7)], dim=2)\n    before = video.clone()\n\n    corrected, report = apply_source_trajectory_bridge(video, 6, requested=True)\n\n    assert report["source_trajectory_bridge_accepted"] is True\n    assert report["source_trajectory_temporal_profile"]["axis_mode"][1] == "persistent"\n    envelope = report["source_trajectory_temporal_profile"]["axis"][1]["applied_envelope"]\n    assert envelope["measured_followup_transitions"] == 4\n    assert envelope["extrapolated_beyond_observation"] is False\n    assert report["source_trajectory_bridge_tokens_corrected"] == 5\n    assert not torch.equal(corrected[:, :, 6:11], before[:, :, 6:11])\n    assert torch.equal(corrected[:, :, 11:], before[:, :, 11:])\n'''
          if "def test_persistent_source_state_is_limited_to_measured_window" not in text:
              test.write_text(text.rstrip() + addition + "\n")
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr24-source-review-fixes.yml
          git add h3_flow_regenerate/source_trajectory_bridge.py h3_flow_regenerate/runtime.py h3_flow_regenerate/target_sparse_node.py tests/test_source_trajectory_bridge.py
          git commit -m "Bound source trajectory repair to measured evidence"
          git push origin HEAD:mirror/pr24-source-trajectory-pre-upscale
