name: Apply PR24 source patch

on:
  push:
    branches: [mirror/pr24-source-trajectory-pre-upscale]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-source-trajectory-pre-upscale
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  "h3_flow_regenerate/source_trajectory_bridge.py",
                  '''    if all(abs(state - boundary) <= floor for state in states[1:]):\n        report.update(\n            accepted=True,\n            mode="persistent",\n            reason="persistent_state_within_estimator_floor",\n            active_tokens=suffix_length,\n            applied_envelope={\n                "kind": "constant",\n                "value": 1.0,\n                "active_tokens": suffix_length,\n            },\n        )\n        return report\n''',
                  '''    if all(abs(state - boundary) <= floor for state in states[1:]):\n        # Persistence is proven only through the contiguous follow-up transitions\n        # we actually measured. Never project a constant correction beyond that\n        # observed temporal window.\n        observed_tokens = min(suffix_length, len(followup_signed_residuals) + 1)\n        report.update(\n            accepted=True,\n            mode="persistent",\n            reason="persistent_state_within_estimator_floor_observed_window",\n            active_tokens=observed_tokens,\n            applied_envelope={\n                "kind": "constant",\n                "value": 1.0,\n                "active_tokens": observed_tokens,\n                "measured_followup_transitions": len(followup_signed_residuals),\n                "extrapolated_beyond_observation": False,\n            },\n        )\n        return report\n''',
              ),
              (
                  "h3_flow_regenerate/runtime.py",
                  '''            representation_option_requested = bool(getattr(config, "suffix_geometric_bridge", False))\n            source_trajectory_accepted = bool(\n                source_trajectory_metrics["source_trajectory_bridge_accepted"]\n            )\n            representation_requested = representation_option_requested and source_trajectory_accepted\n            if representation_requested:\n                corrected_clean, representation_metrics = apply_suffix_representation_bridge(\n                    learned_clean,\n                    exact_prefix,\n                    requested=True,\n                )\n            else:\n                corrected_clean = learned_clean\n                representation_metrics = disabled_suffix_representation_bridge_metrics(\n                    prefix_t=mixed_plan.prefix_t,\n                    requested=representation_option_requested,\n                )\n                if representation_option_requested and not source_trajectory_accepted:\n                    representation_metrics["suffix_representation_bridge_reason"] = (\n                        "source_trajectory_not_authorized"\n                    )\n''',
                  '''            representation_requested = bool(getattr(config, "suffix_geometric_bridge", False))\n            if representation_requested:\n                corrected_clean, representation_metrics = apply_suffix_representation_bridge(\n                    learned_clean,\n                    exact_prefix,\n                    requested=True,\n                )\n            else:\n                corrected_clean = learned_clean\n                representation_metrics = disabled_suffix_representation_bridge_metrics(\n                    prefix_t=mixed_plan.prefix_t,\n                    requested=False,\n                )\n''',
              ),
          ]

          changed = False
          for path, old, new in replacements:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise RuntimeError(f"patch target mismatch in {path}: {text.count(old)}")
              file.write_text(text.replace(old, new, 1))
              changed = True

          if changed:
              test = Path("tests/test_source_trajectory_bridge.py")
              text = test.read_text()
              if "def test_persistent_source_state_is_limited_to_measured_window" not in text:
                  text += '''\n\ndef test_persistent_source_state_is_limited_to_measured_window():\n    frame = _texture()\n    prefix = [frame.clone() for _ in range(6)]\n    shifted = _warp(frame, sy=1.0 / 0.975)\n    video = torch.stack(prefix + [shifted.clone() for _ in range(7)], dim=2)\n    before = video.clone()\n    corrected, report = apply_source_trajectory_bridge(video, 6, requested=True)\n    assert report["source_trajectory_bridge_accepted"] is True\n    assert report["source_trajectory_temporal_profile"]["axis_mode"][1] == "persistent"\n    envelope = report["source_trajectory_temporal_profile"]["axis"][1]["applied_envelope"]\n    assert envelope["measured_followup_transitions"] == 4\n    assert envelope["extrapolated_beyond_observation"] is False\n    assert report["source_trajectory_bridge_tokens_corrected"] == 5\n    assert not torch.equal(corrected[:, :, 6:11], before[:, :, 6:11])\n    assert torch.equal(corrected[:, :, 11:], before[:, :, 11:])\n'''
                  test.write_text(text)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/source_trajectory_bridge.py h3_flow_regenerate/runtime.py tests/test_source_trajectory_bridge.py
          git commit -m "Bound source trajectory repair to measured evidence"
          git push origin HEAD:mirror/pr24-source-trajectory-pre-upscale
