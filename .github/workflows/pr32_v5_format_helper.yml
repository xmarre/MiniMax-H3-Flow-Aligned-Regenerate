name: PR32 v5 format helper

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr32-00391-authoritative-motion-20260912
          fetch-depth: 0
      - name: Apply exact Ruff formatting and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("h3_flow_regenerate/representation_bridge.py")
          text = path.read_text()
          old = '''    values = tuple(\n        _theil_sen_predict([(index, vector[axis]) for index, vector in signed], target_index)\n        for axis in range(4)\n    )'''
          new = '''    values = tuple(\n        _theil_sen_predict([(index, vector[axis]) for index, vector in signed], target_index) for axis in range(4)\n    )'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one formatting anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/pr32_v5_format_helper.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h3_flow_regenerate/representation_bridge.py
          git commit -m "Format authoritative motion predictor"
          git push origin HEAD:mirror/pr32-00391-authoritative-motion-20260912
