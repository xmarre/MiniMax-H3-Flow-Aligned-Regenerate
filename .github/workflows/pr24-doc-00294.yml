name: PR24 00294 documentation sync

on:
  push:
    branches:
      - mirror/pr24-measured-source-drift
    paths:
      - .pr24-doc-00294-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr24-measured-source-drift
          fetch-depth: 0
      - name: Sync 00294 source-drift evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          seam = Path('docs/mixed-grid-seam-repair.md')
          text = seam.read_text()
          old = """The second result is decisive: the exact-prefix replacement splice is a real measurable seam amplifier, but it is not sufficient to explain the visible framing defect. The same vertical-scale signature was already measurable in the genuine source-grid continuation before learned 3D transfer. The experimental repair therefore moves geometric correction to that earlier state instead of trying to compensate after upscaling or refinement.\n"""
          new = """The second result is decisive: the exact-prefix replacement splice is a real measurable seam amplifier, but it is not sufficient to explain the visible framing defect. The same vertical-scale signature was already measurable in the genuine source-grid continuation before learned 3D transfer. The experimental repair therefore moves geometric correction to that earlier state instead of trying to compensate after upscaling or refinement.\n\n`metrics_00294` then controlled the reference-image sizing confound by scaling all references to the same 1.1 MP budget. The preview framing shift remained. That run also used the current threshold-free source authorization policy and measured provisional source-scale residuals on both `sx` and `sy`, but the source repair was still a no-op because the temporal classifier treated directly observed same-direction cumulative drift as an unsafe divergence. The measured scale state actually moved farther from the natural-motion prediction over four consecutive source suffix transitions. That evidence changes the source repair from an offset-only recovering/persistent model to one that can also correct directly observed cumulative drift before learned upscaling.\n"""
          if old not in text:
              raise SystemExit('seam evidence anchor missing')
          text = text.replace(old, new, 1)

          old = """Up to four genuine source suffix transitions are then measured. The correction is accepted only when the observed temporal state is safe:\n\n- **recovering** — the measured residual monotonically approaches the estimator floor or crosses zero; the correction envelope is derived directly from that measured cumulative state;\n- **persistent** — the measured residual remains within one estimator floor of the initial boundary state for at least two follow-up transitions.\n\nPersistent state is deliberately bounded to the directly observed window. With four measured follow-up transitions, at most suffix token 0 plus those four observed tokens can be corrected. The implementation never projects a constant correction over unmeasured later suffix tokens.\n\nThere is no handcrafted `(1, 0.5, 0.25)`-style fade. Recovering weights come from measured residual evolution; persistent weights are constant only over the observed persistent window.\n"""
          new = """Up to four genuine source suffix transitions are then measured. The correction is accepted only when the observed temporal state is safe:\n\n- **recovering** — the measured residual approaches the estimator floor or crosses zero without first making an unresolved excursion; the correction envelope is derived directly from that measured cumulative state;\n- **persistent** — the measured cumulative residual remains within one estimator floor of the initial boundary state for at least two follow-up transitions;\n- **measured drift** — every directly observed follow-up residual stays on the same side/direction as the boundary residual, so each observed suffix token receives the corresponding measured cumulative signed correction instead of a scaled copy of the boundary correction.\n\nPersistent and measured-drift states are deliberately bounded to the directly observed window. With four measured follow-up transitions, at most suffix token 0 plus those four observed tokens can be corrected. No correction is projected onto unmeasured later suffix tokens.\n\nThere is no handcrafted `(1, 0.5, 0.25)`-style fade. Recovering weights come from measured residual evolution; persistent weights are constant only over the observed persistent window; measured-drift transforms come directly from the observed cumulative signed states.\n"""
          if old not in text:
              raise SystemExit('seam temporal anchor missing')
          text = text.replace(old, new, 1)

          old = """After applying the source-grid correction, the boundary is registered again. Every authorized axis must reduce its residual magnitude. A sign crossing is accepted only within the estimator floor. If verification fails, the exact original source tensor is returned instead.\n"""
          new = """After applying the source-grid correction, the boundary is registered again. Every authorized axis must reduce its residual magnitude. For measured-drift axes, every corrected directly observed follow-up transition is also re-registered and must reduce the corresponding residual (or remain inside the estimator floor). A sign crossing is accepted only within the estimator floor. If any required verification fails, the exact original source tensor is returned instead.\n"""
          if old not in text:
              raise SystemExit('seam verification anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              "- post-warp residual reduction ratios;\n",
              "- post-warp boundary and directly observed transition residual-reduction ratios;\n",
              1,
          )
          seam.write_text(text)

          mixed = Path('docs/MIXED_GRID_CONTINUUM.md')
          text = mixed.read_text()
          old = """That falsifies the exact-prefix splice as a sufficient root cause. The same vertical-scale signature is measurable earlier in the genuine source-grid continuation, before learned 3D transfer, so the current experiment acts there first.\n"""
          new = """That falsifies the exact-prefix splice as a sufficient root cause. The same vertical-scale signature is measurable earlier in the genuine source-grid continuation, before learned 3D transfer, so the current experiment acts there first. `metrics_00294` additionally held all reference inputs at the same 1.1 MP budget and still showed the preview framing shift. With the current source-only scalar threshold already removed, that run measured provisional `sx` and `sy` source residuals whose directly observed cumulative states continued away from the natural-motion prediction; the remaining no-op was therefore a temporal-classification limitation rather than a reference-resolution or evidence-threshold result.\n"""
          if old not in text:
              raise SystemExit('mixed evidence anchor missing')
          text = text.replace(old, new, 1)

          old = """Because no independent target-domain observation exists before the upscaler, the earlier two-domain quadrature threshold is not reused as a source-only scalar gate. A source axis must instead clear the existing estimator floor, objective-gain floor, and safety bound; then directly observed suffix evolution must authorize a safe recovering or persistent state; finally the applied warp must strictly reduce the measured boundary residual. `axis_evidence_score` is retained for diagnostics only. Existing cross-grid thresholds elsewhere are unchanged.\n\nUp to four genuine suffix transitions are measured for temporal classification. Recovering weights are derived from the measured cumulative state. Persistent correction is limited to token 0 plus the directly observed follow-up transitions; it is never extended over unmeasured later suffix tokens. There is no handcrafted fade.\n\nAfter correction the source boundary is registered again. Every authorized axis must reduce in residual magnitude, and a sign crossing is allowed only within the estimator floor. Otherwise the exact original source tensor is returned. The protected source prefix and all suffix tokens outside the measured active window remain byte-identical.\n"""
          new = """Because no independent target-domain observation exists before the upscaler, the earlier two-domain quadrature threshold is not reused as a source-only scalar gate. A source axis must instead clear the existing estimator floor, objective-gain floor, and safety bound; then directly observed suffix evolution must authorize a safe recovering, persistent, or measured same-direction drift state; finally the applied warp must strictly reduce the measured residuals. `axis_evidence_score` is retained for diagnostics only. Existing cross-grid thresholds elsewhere are unchanged.\n\nUp to four genuine suffix transitions are measured for temporal classification. Recovering weights are derived from the measured cumulative state. Persistent correction is limited to token 0 plus the directly observed follow-up transitions. A measured-drift state uses each directly observed cumulative signed residual as that suffix token's correction rather than extrapolating or scaling the boundary correction. No mode extends correction over unmeasured later suffix tokens, and there is no handcrafted fade.\n\nAfter correction the source boundary is registered again. Every authorized axis must reduce in residual magnitude. Measured-drift axes additionally re-register every corrected directly observed follow-up transition and require residual reduction there as well. A sign crossing is allowed only within the estimator floor. Otherwise the exact original source tensor is returned. The protected source prefix and all suffix tokens outside the measured active window remain byte-identical.\n"""
          if old not in text:
              raise SystemExit('mixed temporal anchor missing')
          text = text.replace(old, new, 1)
          mixed.write_text(text)
          PY

          rm -f .pr24-doc-00294-trigger .github/workflows/pr24-doc-00294.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Document directly measured source drift evidence'
          git push origin HEAD:mirror/pr24-measured-source-drift
