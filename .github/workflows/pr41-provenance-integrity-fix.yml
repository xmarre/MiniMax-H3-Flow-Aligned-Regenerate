name: Repair PR41 provenance equivalence integrity

on:
  push:
    branches:
      - driver/pr41-provenance-integrity-fix-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair mirror
        uses: actions/checkout@v4
        with:
          ref: mirror/pr41-provenance-integrity-fix-20260915
          fetch-depth: 0

      - name: Check out disposable driver
        uses: actions/checkout@v4
        with:
          ref: driver/pr41-provenance-integrity-fix-20260915
          path: .driver

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply fail-closed equivalence repair and tamper test
        run: python .driver/tools/pr41_integrity_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build

      - name: Format and validate focused repair
        run: |
          ruff format h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
          ruff check h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
          pytest -q tests/test_same_state_high_replay.py
          python -m compileall -q h3_flow_regenerate/same_state_high_replay.py

      - name: Commit source-only repair
        run: |
          git config user.name xmarre
          git config user.email 54859656+xmarre@users.noreply.github.com
          git add h3_flow_regenerate/same_state_high_replay.py tests/test_same_state_high_replay.py
          git diff --cached --check
          git commit -m 'Harden replay provenance bundle integrity'
          git push origin HEAD:mirror/pr41-provenance-integrity-fix-20260915
