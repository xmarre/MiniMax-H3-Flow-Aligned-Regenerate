name: PR24 mixed attention measure

on:
  push:
    branches:
      - mirror/pr24-mixed-kv-measure

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/pr24_mixed_measure_patch.py')
          s = p.read_text()
          bad = "\ntest_path.write_text(test)\n'''\n# strip accidental terminator from replacement authoring\nreplacement_script = replacement"
          if bad not in s:
              raise SystemExit('expected helper tail not found')
          p.write_text(s.replace(bad, "\ntest_path.write_text(test)\n", 1))
          PY
      - name: Apply patch
        run: python tools/pr24_mixed_measure_patch.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
      - name: Focused validation
        run: |
          ruff check h3_flow_regenerate/mixed_grid.py h3_flow_regenerate/runtime.py tests/test_mixed_grid.py
          ruff format --check h3_flow_regenerate/mixed_grid.py h3_flow_regenerate/runtime.py tests/test_mixed_grid.py
          pytest -q tests/test_mixed_grid.py tests/test_handoff.py tests/test_representation_bridge.py
      - name: Remove temporary patch machinery and commit
        run: |
          rm tools/pr24_mixed_measure_patch.py .github/workflows/pr24-mixed-measure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Normalize Mixed-Grid attention measure upstream'
          git push
